<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing Gallery</title>
<meta name="description" content="지금까지 만든 랜딩페이지 모음 — 바로가기, 파일 다운로드, 코멘트">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Crect x='7' y='7' width='8' height='8' rx='2' fill='%23fff'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2' fill='%23fff' opacity='.6'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2' fill='%23fff' opacity='.6'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div>
      <h1>Landing Gallery</h1>
      <p class="sub"><span id="count">0</span>개의 랜딩페이지 · 바로가기 · 파일 다운로드 · 코멘트</p>
    </div>
    <input id="q" type="search" placeholder="이름·카테고리 검색" aria-label="검색">
  </div>
  <div class="wrap chips" id="chips" role="tablist"></div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>검색 결과가 없어요.</p>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="scrim" data-close></div>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <header class="panel-h">
      <div>
        <h2 id="d-title"></h2>
        <p id="d-sub"></p>
      </div>
      <button class="x" data-close aria-label="닫기">✕</button>
    </header>
    <div class="panel-actions" id="d-actions"></div>
    <p class="hint">닉네임만 적으면 로그인 없이 코멘트를 남길 수 있어요. 답장은 코멘트 아래에 달려요.</p>
    <div class="comments" id="comments"></div>
  </section>
</aside>

<script src="sites.js"></script>
<script src="app.js"></script>
</body>
</html>
