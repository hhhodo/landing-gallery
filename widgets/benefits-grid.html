<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benefits Grid Widget</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<style>
body{margin:0;font-family:'Pretendard',sans-serif;background:#f4f4f2}
.bw{--bw-bg:#1b1b1b;--bw-card:#262626;--bw-text:#ffffff;--bw-sub:#a8a8a8;--bw-accent:#f6f3ee;--bw-radius:20px;--bw-cols:3;--bw-gap:20px;--bw-pad:96px;--bw-width:1160px;--bw-icon:28px;
 background:var(--bw-bg);color:var(--bw-text);padding:var(--bw-pad) 20px}
.bw__in{max-width:var(--bw-width);margin:0 auto}
.bw__eyebrow{font-size:13px;letter-spacing:.08em;color:var(--bw-sub);margin:0 0 12px}
.bw__title{font-size:44px;line-height:1.2;margin:0 0 12px;font-weight:700}
.bw__note{color:var(--bw-sub);margin:0 0 48px}
.bw__grid{display:grid;grid-template-columns:repeat(var(--bw-cols),1fr);gap:var(--bw-gap)}
.bw__card{background:var(--bw-card);border-radius:var(--bw-radius);padding:28px;display:flex;flex-direction:column;gap:12px;border:1px solid transparent}
.bw[data-border=true] .bw__card{border-color:color-mix(in srgb,var(--bw-text) 15%,transparent)}
.bw[data-hover=true] .bw__card{transition:transform .2s,border-color .2s}
.bw[data-hover=true] .bw__card:hover{transform:translateY(-4px);border-color:var(--bw-accent)}
.bw__icon{font-size:var(--bw-icon);line-height:1;color:var(--bw-accent);margin-bottom:8px}
.bw[data-icon=false] .bw__icon{display:none}
.bw__name{margin:0;font-size:20px;font-weight:700}
.bw__desc{margin:0;font-size:15px;line-height:1.65;color:var(--bw-sub)}
@media(max-width:900px){.bw__grid{grid-template-columns:1fr}}
.cw-panel{position:fixed;top:16px;right:16px;z-index:9999;width:280px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;color:#1a1a1a;border:1px solid #d9d9d9;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);font:14px/1.4 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif}
.cw-panel *{box-sizing:border-box}
.cw-panel__head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;font-weight:700}
.cw-panel__toggle{border:0;background:#f0f0f0;border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px}
.cw-panel.is-closed .cw-panel__body{display:none}
.cw-panel__body{padding:6px 14px 14px}
.cw-group{margin:12px 0 4px;font-size:11px;font-weight:700;letter-spacing:.04em;color:#888;text-transform:uppercase}
.cw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.cw-row label{flex:0 0 auto;color:#444}
.cw-row input[type=color]{width:44px;height:28px;border:1px solid #ccc;border-radius:6px;padding:0;background:none;cursor:pointer}
.cw-row input[type=range]{flex:1;min-width:0}
.cw-row .cw-val{width:44px;text-align:right;font-size:12px;color:#777}
.cw-row select,.cw-row input[type=text]{flex:1;min-width:0;font:inherit;padding:4px 6px;border:1px solid #ccc;border-radius:6px}
.cw-btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cw-btns button{flex:1;font:inherit;font-size:12px;padding:6px 8px;border:1px solid #1a1a1a;background:#fff;border-radius:8px;cursor:pointer}
.cw-btns button.is-primary{background:#1a1a1a;color:#fff}
.cw-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:8px 14px;border-radius:999px;font:13px 'Pretendard',sans-serif;z-index:10000}
[contenteditable=true]{outline:1px dashed rgba(120,120,255,.7);outline-offset:2px;cursor:text}
@media (max-width:640px){.cw-panel{top:auto;bottom:0;right:0;left:0;width:auto;border-radius:14px 14px 0 0;max-height:55vh}}

.cw-row input[type=number]{width:88px;flex:none;font:inherit;padding:4px 6px;border:1px solid #ccc;border-radius:6px;text-align:right}
.cw-row input[type=number]+.cw-val{width:auto;text-align:left}
.cw-row label{flex:1}

</style></head><body>
<section class="bw" id="cw-bw" data-icon="true" data-border="true" data-hover="true">
 <div class="bw__in">
  <p class="bw__eyebrow" data-g="eyebrow"></p><h2 class="bw__title" data-g="title"></h2><p class="bw__note" data-g="note"></p>
  <div class="bw__grid" id="cw-bw-grid"></div>
 </div>
</section>
<script>/* Widget control panel. Usage: CWPanel.mount({title, root, controls, defaults, onChange})
   control types: color | range | select | toggle | text | button | group
   - {key, type, label, css:'--var', unit:'px'}  -> sets CSS var on root
   - {key, type:'select'|'toggle', attr:'data-x'} -> sets attribute on root
   - any control may be read in onChange(state) for re-render. */
(function(){
  function mount(cfg){
    window.__cwSchema={controls:cfg.controls.filter(function(c){return c.key}).map(function(c){var o={};['key','type','label','css','attr','unit','min','max','step','options','default'].forEach(function(k){if(c[k]!==undefined)o[k]=c[k]});if(o.type==='range')o.type='number';return o}),title:cfg.title};
    document.documentElement.setAttribute('data-cw-schema',JSON.stringify(window.__cwSchema));
    var root=cfg.root, state=Object.assign({},cfg.defaults||{}), initial;
    var panel=document.createElement('aside'); panel.className='cw-panel';
    panel.innerHTML='<div class="cw-panel__head"><span>'+(cfg.title||'위젯 설정')+'</span><button class="cw-panel__toggle" type="button">접기</button></div><div class="cw-panel__body"></div>';
    var body=panel.querySelector('.cw-panel__body');
    panel.querySelector('.cw-panel__toggle').onclick=function(e){panel.classList.toggle('is-closed');e.target.textContent=panel.classList.contains('is-closed')?'펼치기':'접기'};
    var inputs={};
    function apply(c){
      var v=state[c.key];
      if(c.css) root.style.setProperty(c.css,(c.type==='range'&&c.unit)?v+c.unit:v);
      if(c.attr) root.setAttribute(c.attr,c.type==='toggle'?String(!!v):v);
    }
    function emit(c){apply(c);cfg.onChange&&cfg.onChange(state,c.key)}
    cfg.controls.forEach(function(c){
      if(c.type==='group'){var g=document.createElement('div');g.className='cw-group';g.textContent=c.label;body.appendChild(g);return}
      if(c.type==='button'){var b=document.createElement('div');b.className='cw-btns';var btn=document.createElement('button');btn.type='button';btn.textContent=c.label;btn.onclick=c.onClick;b.appendChild(btn);body.appendChild(b);return}
      var row=document.createElement('div');row.className='cw-row';
      var id='cw_'+c.key, lab=document.createElement('label');lab.htmlFor=id;lab.textContent=c.label;row.appendChild(lab);
      var el;
      if(c.type==='select'){el=document.createElement('select');c.options.forEach(function(o){var op=document.createElement('option');op.value=o.value!==undefined?o.value:o;op.textContent=o.label||o;el.appendChild(op)})}
      else{el=document.createElement('input');el.type=c.type==='toggle'?'checkbox':(c.type==='range'?'number':c.type);if(c.type==='range'){el.min=c.min;el.max=c.max;el.step=c.step||1;el.inputMode='decimal'}}
      el.id=id;inputs[c.key]=el;
      if(state[c.key]===undefined) state[c.key]=c.default;
      var val=null;if(c.type==='range'&&c.unit){val=document.createElement('span');val.className='cw-val';val.textContent=c.unit}
      function sync(){if(c.type==='toggle')el.checked=!!state[c.key];else el.value=state[c.key];}
      sync();
      el.addEventListener(c.type==='range'||c.type==='color'||c.type==='text'?'input':'change',function(){if(c.type==='range'){if(el.value==='')return;var n=Number(el.value);if(isNaN(n))return;n=Math.min(c.max,Math.max(c.min,n));state[c.key]=n}else state[c.key]=c.type==='toggle'?el.checked:el.value;emit(c)});
      if(c.type==='range')el.addEventListener('blur',function(){sync()});
      row.appendChild(el);if(val)row.appendChild(val);body.appendChild(row);
      c._sync=sync;
    });
    initial=JSON.stringify(state);
    var bar=document.createElement('div');bar.className='cw-btns';
    bar.innerHTML='<button type="button" data-a="reset">초기화</button><button type="button" class="is-primary" data-a="copy">설정 복사(JSON)</button>';
    body.appendChild(bar);
    bar.onclick=function(e){var a=e.target.dataset.a;if(a==='reset'){state=JSON.parse(initial);cfg.controls.forEach(function(c){if(c.key&&c._sync){c._sync();apply(c)}});cfg.onReset&&cfg.onReset();cfg.onChange&&cfg.onChange(state,null)}
      if(a==='copy'){var t=JSON.stringify(cfg.getExport?cfg.getExport(state):state,null,2);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('설정을 복사했습니다')},function(){window.prompt('복사하세요',t)})}};
    document.body.appendChild(panel);
    if(/[?&]nopanel/.test(location.search))panel.style.display='none';
    cfg.controls.forEach(function(c){if(c.key&&(c.css||c.attr))apply(c)});
    cfg.onChange&&cfg.onChange(state,null);
    return {state:function(){return state},panel:panel};
  }
  function toast(m){var t=document.createElement('div');t.className='cw-toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1600)}
  /* inline text editing: elements with data-i (index) + data-f (field) write back into data[i][f]; data-g edits data.meta[g] */
  function setEditable(container,on){container.querySelectorAll('[data-f],[data-g]').forEach(function(n){n.contentEditable=on?'true':'false'});}
  function bindEdit(container,data,meta){container.addEventListener('input',function(e){var n=e.target.closest('[data-f],[data-g]');if(!n)return;if(n.dataset.g)meta[n.dataset.g]=n.textContent;else data[+n.dataset.i][n.dataset.f]=n.innerText.replace(/\n+$/,'')});
    container.addEventListener('keydown',function(e){if(e.target.isContentEditable&&e.key===' ')e.stopPropagation()});}
  window.CWPanel={mount:mount,toast:toast,setEditable:setEditable,bindEdit:bindEdit};
})();
</script>
<script>
(function(){
 var root=document.getElementById('cw-bw'),grid=document.getElementById('cw-bw-grid'),editing=false;
 var initMeta={eyebrow:'WHY AMBLE',title:'오래 곁에 둘 것만 골라 담습니다',note:'유행이 아니라 태도로 고른 사물만 소개합니다.'},meta=Object.assign({},initMeta);
 var init=[
  {icon:'◆',name:'에디터 큐레이션',desc:'120개 이상의 국내외 브랜드 중, 매달 소수의 아이템만 선별합니다.'},
  {icon:'◷',name:'부담 없는 주기',desc:'월간·격월·분기 중 선택하고, 언제든 건너뛰거나 멈출 수 있습니다.'},
  {icon:'◎',name:'투명한 소재 정보',desc:'모든 오브제는 원산지, 소재, 생산 방식을 상세히 표기해 전달합니다.'},
  {icon:'▣',name:'무료 배송·반품',desc:'배송비, 반품비 모두 무료. 마음에 들지 않으면 100% 환불해 드립니다.'},
  {icon:'❦',name:'지속가능한 소재',desc:'재생 소재, 국내 소규모 공방과의 협업 비중을 매년 늘려가고 있습니다.'},
  {icon:'✉',name:'1:1 상담',desc:'취향이 바뀌면 언제든 스타일리스트에게 문의할 수 있습니다.'}];
 var data=JSON.parse(JSON.stringify(init));
 function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
 function render(){
  root.querySelectorAll('[data-g]').forEach(function(n){n.textContent=meta[n.dataset.g]});
  grid.innerHTML=data.map(function(d,i){return '<article class="bw__card"><div class="bw__icon" data-i="'+i+'" data-f="icon">'+esc(d.icon)+'</div><h3 class="bw__name" data-i="'+i+'" data-f="name">'+esc(d.name)+'</h3><p class="bw__desc" data-i="'+i+'" data-f="desc">'+esc(d.desc)+'</p></article>'}).join('');
  CWPanel.setEditable(root,editing);
 }
 CWPanel.bindEdit(root,data,meta);
 CWPanel.mount({title:'혜택 위젯 설정',root:root,defaults:{edit:false},
  getExport:function(s){return{settings:s,meta:meta,items:data}},
  onReset:function(){data.length=0;JSON.parse(JSON.stringify(init)).forEach(function(d){data.push(d)});Object.assign(meta,initMeta);editing=false;render()},
  onChange:function(s){editing=!!s.edit;render()},
  controls:[
   {type:'group',label:'콘텐츠'},
   {key:'edit',type:'toggle',label:'텍스트 직접 편집',default:false},
   {type:'button',label:'+ 카드 추가',onClick:function(){data.push({icon:'★',name:'새 혜택',desc:'설명을 입력하세요.'});render()}},
   {type:'button',label:'− 마지막 카드 삭제',onClick:function(){data.pop();render()}},
   {type:'group',label:'레이아웃'},
   {key:'cols',type:'range',label:'열 수',css:'--bw-cols',min:1,max:4,default:3},
   {key:'gap',type:'range',label:'카드 간격',css:'--bw-gap',unit:'px',min:8,max:56,default:20},
   {key:'icon',type:'toggle',label:'아이콘 표시',attr:'data-icon',default:true},
   {key:'border',type:'toggle',label:'테두리',attr:'data-border',default:true},
   {key:'hover',type:'toggle',label:'호버 효과',attr:'data-hover',default:true},
   {key:'isize',type:'range',label:'아이콘 크기',css:'--bw-icon',unit:'px',min:16,max:64,default:28},
   {type:'group',label:'스타일'},
   {key:'bg',type:'color',label:'섹션 배경',css:'--bw-bg',default:'#1b1b1b'},
   {key:'card',type:'color',label:'카드 배경',css:'--bw-card',default:'#262626'},
   {key:'text',type:'color',label:'글자색',css:'--bw-text',default:'#ffffff'},
   {key:'sub',type:'color',label:'보조 글자색',css:'--bw-sub',default:'#a8a8a8'},
   {key:'accent',type:'color',label:'강조색',css:'--bw-accent',default:'#f6f3ee'},
   {key:'radius',type:'range',label:'모서리',css:'--bw-radius',unit:'px',min:0,max:40,default:20},
   {key:'pad',type:'range',label:'상하 여백',css:'--bw-pad',unit:'px',min:16,max:200,step:4,default:96}
  ]});
})();
</script></body></html>
