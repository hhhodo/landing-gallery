<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프로세스 단계 위젯</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>body{margin:0;background:#f4f4f2}</style></head><body>
<!-- 프로세스 단계 커스텀 위젯 · 코드 삽입/커스텀 위젯에 통째로 붙여넣기 (외부 의존성 없음 · 폰트는 사이트 폰트 사용) -->
<script>
/* ============================================================
   프로세스 단계 위젯 설정값 — 아래 숫자/값만 고치면 위젯에 반영됩니다.
   ============================================================ */
window.CW_CONFIG = window.CW_CONFIG || {};
window.CW_CONFIG['cw-sw'] = {
  settings: {
    dir: "horizontal",        // 방향 : horizontal=가로 | vertical=세로
    icon: 1,                  // 번호 원형 아이콘 (1=켜기, 0=끄기)
    num: 1,                   // STEP 라벨 (1=켜기, 0=끄기)
    connector: 1,             // 연결선 (1=켜기, 0=끄기)
    gap: 20,                  // 간격 (px · 8~56)
    isize: 56,                // 아이콘 크기 (px · 32~96)
    bg: "#f6f3ee",            // 섹션 배경 (색상 hex)
    card: "#ffffff",          // 카드 배경 (색상 hex)
    text: "#1b1b1b",          // 글자색 (색상 hex)
    accent: "#1b1b1b",        // 강조색 (색상 hex)
    radius: 20,               // 모서리 (px · 0~40)
    pad: 96,                  // 상하 여백 (px · 16~200)
  },
  // 문구 (따옴표 안의 글자만 수정 · 항목 추가/삭제는 { } 블록 단위로)
  meta: {
      "eyebrow": "HOW IT WORKS",
      "title": "4단계면 충분합니다",
      "note": "복잡한 절차 없이, 신청부터 배송까지 한 번에 이어집니다."
  },
  steps: [
      {
          "name": "취향 진단",
          "desc": "간단한 설문으로 리빙·웰니스·아웃도어 중 선호하는 결을 확인합니다."
      },
      {
          "name": "플랜 선택",
          "desc": "월간·격월 등 원하는 주기와 예산에 맞는 플랜을 고릅니다."
      },
      {
          "name": "큐레이션 배송",
          "desc": "에디터가 고른 오브제 3~5종을 48시간 내 상자에 담아 보내드립니다."
      },
      {
          "name": "언제든 조정",
          "desc": "다음 배송 전까지 자유롭게 플랜 변경, 건너뛰기, 해지가 가능합니다."
      }
  ]
};
</script>
<style>
.sw{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif}
.sw{--sw-bg:#f6f3ee;--sw-card:#ffffff;--sw-text:#1b1b1b;--sw-sub:#6b6b6b;--sw-accent:#1b1b1b;--sw-radius:20px;--sw-gap:20px;--sw-pad:96px;--sw-width:1160px;--sw-icon:56px;
 background:var(--sw-bg);color:var(--sw-text);padding:var(--sw-pad) 20px}
.sw__in{max-width:var(--sw-width);margin:0 auto}
.sw__eyebrow{font-size:13px;letter-spacing:.08em;color:var(--sw-sub);margin:0 0 12px}
.sw__title{font-size:44px;line-height:1.2;margin:0 0 12px;font-weight:700}
.sw__note{color:var(--sw-sub);margin:0 0 48px}
.sw__list{display:grid;grid-template-columns:repeat(var(--sw-n),1fr);gap:var(--sw-gap);counter-reset:s}
.sw[data-dir=vertical] .sw__list{grid-template-columns:1fr}
.sw__step{background:var(--sw-card);border-radius:var(--sw-radius);padding:28px;position:relative;display:flex;flex-direction:column;gap:12px}
.sw[data-dir=vertical] .sw__step{flex-direction:row;align-items:flex-start;gap:24px}
.sw__num{font-size:12px;letter-spacing:.08em;color:var(--sw-sub)}
.sw__icon{width:var(--sw-icon);height:var(--sw-icon);border-radius:50%;background:var(--sw-accent);color:var(--sw-card);display:grid;place-items:center;font-size:calc(var(--sw-icon)*.4);font-weight:700;flex:none}
.sw[data-icon=false] .sw__icon{display:none}
.sw[data-num=false] .sw__num{display:none}
.sw__name{margin:0;font-size:22px;font-weight:700}
.sw__desc{margin:0;font-size:15px;line-height:1.65;color:var(--sw-sub)}
.sw[data-connector=true]:not([data-dir=vertical]) .sw__step:not(:last-child):after{content:"";position:absolute;top:calc(28px + var(--sw-icon)/2 + 12px);left:100%;width:var(--sw-gap);border-top:2px dashed var(--sw-accent);opacity:.35}
@media(max-width:900px){.sw__list{grid-template-columns:1fr}.sw__step:after{display:none}}
</style>
<section class="sw" id="cw-sw" data-dir="horizontal" data-icon="true" data-num="true" data-connector="true">
 <div class="sw__in">
  <p class="sw__eyebrow" data-g="eyebrow"></p><h2 class="sw__title" data-g="title"></h2><p class="sw__note" data-g="note"></p>
  <div class="sw__list" id="cw-sw-list"></div>
 </div>
</section>
<script>
/* 위젯 런타임 (조작 패널 없음). 설정값은 widget.html 상단 CW_CONFIG 숫자/값만 고치면 반영된다. */
(function(){
  var R=window.CWWidgets=window.CWWidgets||{};
  window.CWPanel={toast:function(){},setEditable:function(){},bindEdit:function(){},
  mount:function(cfg){
    var root=cfg.root,state={},map={},C=((window.CW_CONFIG||{})[root.id]||{}).settings||{};
    function coerce(c,v){if(c.type==='toggle')return v===true||v===1||v==='1'||v==='true';if(c.type==='range')return Number(v);return v}
    function ap(c){var v=state[c.key];if(c.css)root.style.setProperty(c.css,(c.type==='range'&&c.unit)?v+c.unit:v);if(c.attr)root.setAttribute(c.attr,c.type==='toggle'?String(!!v):v)}
    cfg.controls.forEach(function(c){if(!c.key)return;map[c.key]=c;state[c.key]=coerce(c,C[c.key]!==undefined?C[c.key]:c.default);ap(c)});
    var sc=cfg.controls.filter(function(c){return c.key&&c.key!=='edit'}).map(function(c){var o={};['key','type','label','css','attr','unit','min','max','step','options','default'].forEach(function(k){if(c[k]!==undefined)o[k]=c[k]});return o});
    document.documentElement.setAttribute('data-cw-schema-'+root.id,JSON.stringify({title:cfg.title,controls:sc}));
    cfg.onChange&&cfg.onChange(state,null);
    var api=R[root.id]={state:state,set:function(k,v){var c=map[k];if(!c)return;state[k]=coerce(c,v);ap(c);cfg.onChange&&cfg.onChange(state,k)},export:function(){return cfg.getExport?cfg.getExport(state):state}};
    return api}};
})();

(function(){
 var root=document.getElementById('cw-sw'),list=document.getElementById('cw-sw-list'),editing=false;
 var initMeta={eyebrow:'HOW IT WORKS',title:'4단계면 충분합니다',note:'복잡한 절차 없이, 신청부터 배송까지 한 번에 이어집니다.'},meta=Object.assign({},initMeta);
 var init=[
  {name:'취향 진단',desc:'간단한 설문으로 리빙·웰니스·아웃도어 중 선호하는 결을 확인합니다.'},
  {name:'플랜 선택',desc:'월간·격월 등 원하는 주기와 예산에 맞는 플랜을 고릅니다.'},
  {name:'큐레이션 배송',desc:'에디터가 고른 오브제 3~5종을 48시간 내 상자에 담아 보내드립니다.'},
  {name:'언제든 조정',desc:'다음 배송 전까지 자유롭게 플랜 변경, 건너뛰기, 해지가 가능합니다.'}];
 var data=JSON.parse(JSON.stringify(init));
 function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
 function render(){
  root.style.setProperty('--sw-n',data.length);
  root.querySelectorAll('[data-g]').forEach(function(n){n.textContent=meta[n.dataset.g]});
  list.innerHTML=data.map(function(d,i){var n=i+1;return '<article class="sw__step"><div class="sw__icon">'+n+'</div><div><span class="sw__num">STEP '+(n<10?'0':'')+n+'</span><h3 class="sw__name" data-i="'+i+'" data-f="name">'+esc(d.name)+'</h3><p class="sw__desc" data-i="'+i+'" data-f="desc">'+esc(d.desc)+'</p></div></article>'}).join('');
  CWPanel.setEditable(root,editing);
 }
 var CFG=(window.CW_CONFIG||{})['cw-sw']||{};if(CFG.meta)Object.assign(meta,CFG.meta);if(CFG.steps){data.length=0;CFG.steps.forEach(function(d){data.push(d)})}
 CWPanel.bindEdit(root,data,meta);
 CWPanel.mount({title:'프로세스 위젯 설정',root:root,defaults:{edit:false},
  getExport:function(s){return{settings:s,meta:meta,steps:data}},
  onReset:function(){data.length=0;JSON.parse(JSON.stringify(init)).forEach(function(d){data.push(d)});Object.assign(meta,initMeta);editing=false;render()},
  onChange:function(s){editing=!!s.edit;render()},
  controls:[
   {type:'group',label:'콘텐츠'},
   {key:'edit',type:'toggle',label:'텍스트 직접 편집',default:false},
   {type:'button',label:'+ 단계 추가',onClick:function(){data.push({name:'새 단계',desc:'설명을 입력하세요.'});render()}},
   {type:'button',label:'− 마지막 단계 삭제',onClick:function(){if(data.length>1)data.pop();render()}},
   {type:'group',label:'레이아웃'},
   {key:'dir',type:'select',label:'방향',attr:'data-dir',options:[{value:'horizontal',label:'가로'},{value:'vertical',label:'세로'}],default:'horizontal'},
   {key:'icon',type:'toggle',label:'번호 원형 아이콘',attr:'data-icon',default:true},
   {key:'num',type:'toggle',label:'STEP 라벨',attr:'data-num',default:true},
   {key:'connector',type:'toggle',label:'연결선',attr:'data-connector',default:true},
   {key:'gap',type:'range',label:'간격',css:'--sw-gap',unit:'px',min:8,max:56,default:20},
   {key:'isize',type:'range',label:'아이콘 크기',css:'--sw-icon',unit:'px',min:32,max:96,default:56},
   {type:'group',label:'스타일'},
   {key:'bg',type:'color',label:'섹션 배경',css:'--sw-bg',default:'#f6f3ee'},
   {key:'card',type:'color',label:'카드 배경',css:'--sw-card',default:'#ffffff'},
   {key:'text',type:'color',label:'글자색',css:'--sw-text',default:'#1b1b1b'},
   {key:'accent',type:'color',label:'강조색',css:'--sw-accent',default:'#1b1b1b'},
   {key:'radius',type:'range',label:'모서리',css:'--sw-radius',unit:'px',min:0,max:40,default:20},
   {key:'pad',type:'range',label:'상하 여백',css:'--sw-pad',unit:'px',min:16,max:200,step:4,default:96}
  ]});
})();
</script>
</body></html>
