<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reviews Widget</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="shared/panel.css">
<style>
body{margin:0;font-family:'Pretendard',sans-serif;background:#f4f4f2}
.rw{--rw-bg:#ffffff;--rw-card:#f6f3ee;--rw-text:#1b1b1b;--rw-sub:#6b6b6b;--rw-star:#f5a623;--rw-radius:16px;--rw-cols:3;--rw-gap:20px;--rw-pad:96px;--rw-quote:18px;--rw-width:1160px;
 background:var(--rw-bg);color:var(--rw-text);padding:var(--rw-pad) 20px}
.rw__in{max-width:var(--rw-width);margin:0 auto}
.rw__eyebrow{font-size:13px;letter-spacing:.08em;color:var(--rw-sub);margin:0 0 12px}
.rw__title{font-size:44px;line-height:1.2;margin:0 0 48px;font-weight:700}
.rw__grid{display:grid;grid-template-columns:repeat(var(--rw-cols),1fr);gap:var(--rw-gap)}
.rw[data-layout=slider] .rw__grid{grid-template-columns:1fr}
.rw[data-layout=slider] .rw__card:not(.is-current){display:none}
.rw__card{background:var(--rw-card);border-radius:var(--rw-radius);padding:28px;display:flex;flex-direction:column;gap:16px}
.rw__stars{color:var(--rw-star);letter-spacing:2px;font-size:18px}
.rw[data-stars=false] .rw__stars{display:none}
.rw__quote{margin:0;font-size:var(--rw-quote);line-height:1.65;flex:1}
.rw__meta{display:flex;align-items:center;gap:12px}
.rw[data-avatar=false] .rw__avatar{display:none}
.rw__avatar{width:40px;height:40px;border-radius:50%;background:var(--rw-text);color:var(--rw-bg);display:grid;place-items:center;font-weight:700;flex:none}
.rw__meta b{display:block;font-size:15px}.rw__meta span{font-size:13px;color:var(--rw-sub)}
.rw__nav{display:none;justify-content:center;align-items:center;gap:16px;margin-top:24px}
.rw[data-layout=slider] .rw__nav{display:flex}
.rw__nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--rw-text);background:transparent;color:var(--rw-text);cursor:pointer;font-size:16px}
@media(max-width:900px){.rw__grid{grid-template-columns:1fr}}
</style></head><body>
<section class="rw" id="rw" data-layout="grid" data-stars="true" data-avatar="true">
 <div class="rw__in">
  <p class="rw__eyebrow" data-g="eyebrow"></p><h2 class="rw__title" data-g="title"></h2>
  <div class="rw__grid" id="grid"></div>
  <div class="rw__nav"><button type="button" id="prev" aria-label="이전">←</button><span id="count"></span><button type="button" id="next" aria-label="다음">→</button></div>
 </div>
</section>
<script src="shared/panel.js"></script>
<script>
(function(){
 var root=document.getElementById('rw'),grid=document.getElementById('grid'),cur=0,editing=false;
 var initMeta={eyebrow:'REVIEWS',title:'구독자들의 이야기'},meta=Object.assign({},initMeta);
 var init=[
  {quote:'매달 뭘 살지 고민하는 시간이 줄었어요. 큐레이터가 고른 물건들이라 실패한 적이 거의 없습니다.',name:'김서연',role:'스탠다드 · 14개월째 구독'},
  {quote:'해지가 어려운 구독 서비스에 지쳤었는데, AMBLE은 정말 클릭 한 번으로 끝나서 오히려 계속 쓰게 돼요.',name:'박도현',role:'프리미엄 · 6개월째 구독'},
  {quote:'소재와 원산지가 꼼꼼히 적혀 있어서 선물용으로도 믿고 고릅니다.',name:'이하린',role:'라이트 · 3개월째 구독'}];
 var data=JSON.parse(JSON.stringify(init));
 function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
 function render(){
  if(cur>=data.length)cur=Math.max(0,data.length-1);
  root.querySelectorAll('[data-g]').forEach(function(n){n.textContent=meta[n.dataset.g]});
  grid.innerHTML=data.map(function(d,i){return '<article class="rw__card'+(i===cur?' is-current':'')+'"><div class="rw__stars" aria-label="별 5개">★★★★★</div><p class="rw__quote" data-i="'+i+'" data-f="quote">'+esc(d.quote)+'</p><div class="rw__meta"><div class="rw__avatar">'+esc((d.name||'?').charAt(0))+'</div><div><b data-i="'+i+'" data-f="name">'+esc(d.name)+'</b><span data-i="'+i+'" data-f="role">'+esc(d.role)+'</span></div></div></article>'}).join('');
  document.getElementById('count').textContent=(cur+1)+' / '+data.length;
  CWPanel.setEditable(root,editing);
 }
 function go(d){cur=(cur+d+data.length)%data.length;render()}
 document.getElementById('prev').onclick=function(){go(-1)};document.getElementById('next').onclick=function(){go(1)};
 CWPanel.bindEdit(root,data,meta);
 CWPanel.mount({title:'리뷰 위젯 설정',root:root,defaults:{edit:false},
  getExport:function(s){return{settings:s,meta:meta,reviews:data}},
  onReset:function(){data.length=0;JSON.parse(JSON.stringify(init)).forEach(function(d){data.push(d)});Object.assign(meta,initMeta);editing=false;cur=0;render()},
  onChange:function(s,k){editing=!!s.edit;render()},
  controls:[
   {type:'group',label:'콘텐츠'},
   {key:'edit',type:'toggle',label:'텍스트 직접 편집',default:false},
   {type:'button',label:'+ 리뷰 추가',onClick:function(){data.push({quote:'후기를 입력하세요.',name:'이름',role:'구독 정보'});cur=data.length-1;render()}},
   {type:'button',label:'− 마지막 리뷰 삭제',onClick:function(){data.pop();render()}},
   {type:'group',label:'레이아웃'},
   {key:'layout',type:'select',label:'형태',attr:'data-layout',options:[{value:'grid',label:'그리드'},{value:'slider',label:'슬라이더(1개씩)'}],default:'grid'},
   {key:'cols',type:'range',label:'열 수',css:'--rw-cols',min:1,max:4,default:3},
   {key:'gap',type:'range',label:'카드 간격',css:'--rw-gap',unit:'px',min:8,max:56,default:20},
   {key:'stars',type:'toggle',label:'별점 표시',attr:'data-stars',default:true},
   {key:'avatar',type:'toggle',label:'아바타 표시',attr:'data-avatar',default:true},
   {type:'group',label:'스타일'},
   {key:'bg',type:'color',label:'섹션 배경',css:'--rw-bg',default:'#ffffff'},
   {key:'card',type:'color',label:'카드 배경',css:'--rw-card',default:'#f6f3ee'},
   {key:'text',type:'color',label:'글자색',css:'--rw-text',default:'#1b1b1b'},
   {key:'star',type:'color',label:'별 색',css:'--rw-star',default:'#f5a623'},
   {key:'radius',type:'range',label:'모서리',css:'--rw-radius',unit:'px',min:0,max:40,default:16},
   {key:'qs',type:'range',label:'후기 글자 크기',css:'--rw-quote',unit:'px',min:13,max:30,default:18},
   {key:'pad',type:'range',label:'상하 여백',css:'--rw-pad',unit:'px',min:16,max:200,step:4,default:96}
  ]});
})();
</script></body></html>
