      "title": "FAQ"

  items: [
      {
          "q": "FORMAX는 어떤 회사인가요?",
          "a": "제조 현장의 설비·품질·생산 데이터를 실시간으로 통합해 운영 의사결정을 돕는 산업 데이터 플랫폼입니다."

      },
      {
          "q": "도입까지 얼마나 걸리나요?",

      },
      {
          "q": "수율 개선 효과는 어떻게 측정하나요?",
          "a": "도입 전 3개월 실적을 기준선으로 잡고, 라인·품목·교대조 단위로 개선 폭을 분리해 리포트합니다."
      },
      {
          "q": "보안은 어떻게 관리되나요?",
          "a": "망분리 환경을 지원하며 온프레미스·프라이빗 클라우드 배포를 모두 제공합니다."
      },

      }
  ]

 var root=document.getElementById('cw-fm'),editing=false;
 var initMeta={"title": "FAQ"},meta=Object.assign({},initMeta);
 var init=[{"q": "FORMAX는 어떤 회사인가요?", "a": "제조 현장의 설비·품질·생산 데이터를 실시간으로 통합해 운영 의사결정을 돕는 산업 데이터 플랫폼입니다."}, {"q": "어떤 설비와 연동되나요?", "a": "PLC, MES, ERP, IoT 센서 등 대부분의 표준 산업 프로토콜(OPC-UA, Modbus 등)을 지원합니다."}, {"q": "기존 MES와 무엇이 다른가요?", "a": "MES가 공정을 기록한다면 FORMAX는 그 기록을 실시간 판단으로 바꿉니다. 교체가 아니라 위에 얹는 레이어입니다."}, {"q": "도입까지 얼마나 걸리나요?", "a": "표준 연동 기준 평균 4~6주 내 파일럿 라인 적용이 가능합니다."}, {"q": "수율 개선 효과는 어떻게 측정하나요?", "a": "도입 전 3개월 실적을 기준선으로 잡고, 라인·품목·교대조 단위로 개선 폭을 분리해 리포트합니다."}, {"q": "보안은 어떻게 관리되나요?", "a": "망분리 환경을 지원하며 온프레미스·프라이빗 클라우드 배포를 모두 제공합니다."}, {"q": "계약은 어떤 방식인가요?", "a": "라인 수 기준 구독형 과금이며, 파일럿 이후 단계적 확장 계약을 지원합니다."}];
 var data=JSON.parse(JSON.stringify(init));
 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 function T(s){return esc(s).replace(/\n/g,'<br>')}
 function metaFill(){root.querySelectorAll('[data-g]').forEach(function(n){var v=meta[n.dataset.g];if(v===undefined){n.style.display='none';return}n.innerHTML=T(v)})}

 var list=document.getElementById('cw-fm-list'),openIdx={0:true};
 function render(){metaFill();root.setAttribute('data-editing',editing);
  list.innerHTML=data.map(function(d,i){var n=i+1;return '<details class="frow"'+((openIdx[i]||editing)?' open':'')+'><summary><span class="chip">'+(n<10?'0':'')+n+'</span><span class="frow__q" data-i="'+i+'" data-f="q">'+esc(d.q)+'</span><span class="frow__ico"></span></summary><p data-i="'+i+'" data-f="a">'+esc(d.a)+'</p></details>'}).join('');
  CWPanel.setEditable(root,editing)}
 list.addEventListener('click',function(e){var s=e.target.closest('summary');if(!s)return;e.preventDefault();if(editing)return;
  var rows=[].slice.call(list.children),row=s.parentNode,i=rows.indexOf(row),was=row.hasAttribute('open');
  if(root.getAttribute('data-single')==='true')rows.forEach(function(r){r.removeAttribute('open')});
  if(was)row.removeAttribute('open');else row.setAttribute('open','')});

 var CFG=(window.CW_CONFIG||{})['cw-fm']||{};if(CFG.meta)Object.assign(meta,CFG.meta);if(CFG.items){data.length=0;CFG.items.forEach(function(d){data.push(d)})}
 root.addEventListener('click',function(e){var t=e.target.closest('[data-img-i]');if(!editing||!t)return;e.preventDefault();e.stopPropagation();var i=+t.getAttribute('data-img-i');var v=window.prompt('이미지 주소(URL)를 입력하세요',data[i].img||'');if(v!==null){data[i].img=v.trim();render()}},true);
 CWPanel.bindEdit(root,data,meta);
 CWPanel.mount({title:'FAQ 위젯',root:root,defaults:{edit:false},
  getExport:function(s){return{settings:s,meta:meta,items:data}},
  onReset:function(){data.length=0;JSON.parse(JSON.stringify(init)).forEach(function(d){data.push(d)});Object.assign(meta,initMeta);editing=false;openIdx={0:true};render()},
  onChange:function(s,k){editing=!!s.edit;render()},
  controls:[
   {type:'group',label:'콘텐츠'},
   {key:'edit',type:'toggle',label:'글자·이미지 편집',default:false},
   {type:'button',label:"+ 질문 추가",onClick:function(){data.push({q:'새 질문',a:'답변을 입력하세요.'});render()}},
   {type:'button',label:"− 마지막 질문 삭제",onClick:function(){if(data.length>1)data.pop();render()}},
   {type:'group',label:"색상·여백"},
   {key:'bg',type:'color',label:"섹션 배경",css:'--fm-bg',default:'#f7f7f5'},
   {key:'ink',type:'color',label:"글자·아이콘색",css:'--ink',default:'#000000'},
   {key:'acc',type:'color',label:"강조 점 색",css:'--accent',default:'#ff6d0e'},
   {key:'pad',type:'range',label:"상하 여백",css:'--fm-pad',unit:'px',min:0,max:400,step:4,default:200},
   {type:'group',label:"레이아웃"},
   {key:'split',type:'select',label:"제목 영역 너비 (12열 중)",attr:'data-split',options:[{"value": "3", "label": "3열"}, {"value": "4", "label": "4열(기본)"}, {"value": "5", "label": "5열"}, {"value": "6", "label": "6열"}],default:'4'},
   {key:'rowgap',type:'range',label:"행 간격",css:'--fm-rowgap',unit:'px',min:0,max:40,step:1,default:4},
   {key:'chip',type:'toggle',label:"번호 칩 표시",attr:'data-chip',default:true},
   {key:'single',type:'toggle',label:"한 번에 하나만 열기",attr:'data-single',default:false}
  ]});
})();
</script>
<script>/* 커스텀 사이드바 (미리보기 전용) */
(function(){
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e}
  function mount(id){
    var w=window.CWWidgets&&CWWidgets[id];if(!w)return;
    var sb=el('aside','cw-sb'),body=el('div','cw-sb__body'),rows=[];
    sb.appendChild(el('div','cw-sb__head','커스텀'));sb.appendChild(body);
    function visible(c){if(!c.when)return true;var v=String(w.state[c.when.key]);return c.when.is.map(String).indexOf(v)>-1}
    function refresh(){
      var g=null,any=false;
      rows.forEach(function(r){
        if(r.isGroup){if(g)g.el.classList.toggle('hide',!any);g=r;any=false;return}
        var ok=visible(r.c);r.el.classList.toggle('hide',!ok);if(ok)any=true});
      if(g)g.el.classList.toggle('hide',!any)}
    var syncs=[];
    w.controls.forEach(function(c){
      if(c.type==='group'){var ge=el('div','cw-sb__g',c.label);body.appendChild(ge);rows.push({isGroup:true,el:ge});return}
      if(c.type==='button'){var b=el('div','cw-sb__b');var bt=el('button','',c.label);bt.type='button';bt.onclick=c.onClick;b.appendChild(bt);body.appendChild(b);return}
      var seg=c.type==='select'&&c.options.length<=6;
      var row=el('div','cw-sb__r'+(seg?' col':''));row.appendChild(el('label','',c.label));
      var ctl;
      if(seg){
        ctl=el('div','cw-sb__seg');
        var btns=c.options.map(function(o){var v=o.value!==undefined?o.value:o,bt=el('button','',o.label||o);bt.type='button';bt.dataset.v=v;bt.onclick=function(){w.set(c.key,v);show();refresh()};ctl.appendChild(bt);return bt});
        var show=function(){btns.forEach(function(b){b.classList.toggle('on',b.dataset.v===String(w.state[c.key]))})};
      }else if(c.type==='select'){
        ctl=el('select');c.options.forEach(function(o){var op=el('option','',o.label||o);op.value=o.value!==undefined?o.value:o;ctl.appendChild(op)});
        ctl.onchange=function(){w.set(c.key,ctl.value);refresh()};var show=function(){ctl.value=w.state[c.key]};
      }else if(c.type==='toggle'){
        ctl=el('label','cw-sb__sw','<input type="checkbox"><span></span>');var cb=ctl.querySelector('input');
        cb.onchange=function(){w.set(c.key,cb.checked);refresh()};var show=function(){cb.checked=!!w.state[c.key]};
      }else if(c.type==='color'){
        ctl=el('div','cw-sb__c','<input type="color"><input type="text" maxlength="7">');var ci=ctl.children[0],ht=ctl.children[1];
        ci.oninput=function(){ht.value=ci.value;w.set(c.key,ci.value)};
        ht.onchange=function(){if(/^#[0-9a-f]{6}$/i.test(ht.value)){ci.value=ht.value;w.set(c.key,ht.value)}else show()};
        var show=function(){ci.value=w.state[c.key];ht.value=w.state[c.key]};
      }else{
        ctl=el('div','cw-sb__n','<input type="number" min="'+c.min+'" max="'+c.max+'" step="'+(c.step||1)+'" inputmode="decimal">'+(c.unit?'<i>'+c.unit+'</i>':''));var ni=ctl.querySelector('input');
        ni.oninput=function(){if(ni.value===''||isNaN(Number(ni.value)))return;w.set(c.key,Math.min(c.max,Math.max(c.min,Number(ni.value))))};
        ni.onblur=function(){show()};var show=function(){ni.value=w.state[c.key]};
      }
      row.appendChild(ctl);body.appendChild(row);rows.push({c:c,el:row});syncs.push(show);show();
    });
    var foot=el('div','cw-sb__foot','<button type="button" data-a="r">초기화</button><button type="button" class="p" data-a="c">설정값 복사</button>');
    foot.onclick=function(e){var a=e.target.dataset.a;if(a==='r'){w.reset();syncs.forEach(function(f){f()});refresh()}
      if(a==='c'){var ex=w.export(),st={};Object.keys(w.state).forEach(function(k){if(k==='edit')return;var v=w.state[k];st[k]=v===true?1:v===false?0:v});
        var lk=Object.keys(ex).filter(function(k){return k!=='settings'&&k!=='meta'})[0],o={settings:st,meta:ex.meta};o[lk]=ex[lk];
        var txt="window.CW_CONFIG['"+id+"'] = "+JSON.stringify(o,null,2)+';';
        (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('복사됨 · widget.html 상단 CW_CONFIG에 붙여넣기')},function(){window.prompt('복사하세요',txt)})}};
    sb.appendChild(foot);document.body.appendChild(sb);refresh();
    if(!/[?&]nosidebar/.test(location.search))document.body.classList.add('cw-has-sidebar');else sb.style.display='none';
  }
  function toast(m){var t=el('div','cw-sb__t',m);document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}
  window.CWSidebar={mount:mount};
})();

CWSidebar.mount('cw-fm');</script></body></html>
