<style>

  --space-section:var(--space-9);}

  margin-block-end:var(--space-6);}

<div class="fx" id="cw-fx" data-dir="left" data-pause="true" data-head="true" data-editing="false">

<p class="eyebrow" style="text-align:center;" data-g="eyebrow"></p><h2 class="h1" style="text-align:center;" data-g="title"></h2><p class="body-2 subtle" style="text-align:center;" data-g="desc"></p>
</div></div><div class="reviews-track"><div class="reviews-track__inner" id="cw-fx-track"></div></div></section></div>
<script>
/* 위젯 런타임 (조작 패널 없음). 설정값은 widget.html 상단 CW_CONFIG 숫자/값만 고치면 반영된다. */
(function(){
  var R=window.CWWidgets=window.CWWidgets||{};
  function setEditable(container,on){container.querySelectorAll('[data-f],[data-g]').forEach(function(n){n.contentEditable=on?'true':'false'})}
  function bindEdit(container,data,meta){container.addEventListener('input',function(e){var n=e.target.closest('[data-f],[data-g]');if(!n)return;if(n.dataset.g)meta[n.dataset.g]=n.innerText.replace(/\n+$/,'');else data[+n.dataset.i][n.dataset.f]=n.innerText.replace(/\n+$/,'')});container.addEventListener('keydown',function(e){if(e.target.isContentEditable&&e.key===' ')e.stopPropagation()})}
  window.CWPanel={toast:function(){},setEditable:setEditable,bindEdit:bindEdit,
  mount:function(cfg){
    var root=cfg.root,state={},map={},C=((window.CW_CONFIG||{})[root.id]||{}).settings||{};
    function coerce(c,v){if(c.type==='toggle')return v===true||v===1||v==='1'||v==='true';if(c.type==='range')return Number(v);return v}
    function ap(c){var v=state[c.key];if(c.css)root.style.setProperty(c.css,(c.type==='range'&&c.unit)?v+c.unit:v);if(c.attr)root.setAttribute(c.attr,c.type==='toggle'?String(!!v):v)}
    cfg.controls.forEach(function(c){if(!c.key)return;map[c.key]=c;state[c.key]=coerce(c,C[c.key]!==undefined?C[c.key]:c.default);ap(c)});
    var sc=cfg.controls.filter(function(c){return c.key&&c.key!=='edit'}).map(function(c){var o={};['key','type','label','css','attr','unit','min','max','step','options','default'].forEach(function(k){if(c[k]!==undefined)o[k]=c[k]});return o});
    document.documentElement.setAttribute('data-cw-schema-'+root.id,JSON.stringify({title:cfg.title,controls:sc}));
    cfg.onChange&&cfg.onChange(state,null);
    var api=R[root.id]={state:state,controls:cfg.controls,defaults:sc.reduce(function(o,c){o[c.key]=c.default;return o},{}),reset:function(){cfg.onReset&&cfg.onReset();Object.keys(map).forEach(function(k){state[k]=coerce(map[k],map[k].default);ap(map[k])});cfg.onChange&&cfg.onChange(state,null)},set:function(k,v){var c=map[k];if(!c)return;state[k]=coerce(c,v);ap(c);cfg.onChange&&cfg.onChange(state,k)},export:function(){return cfg.getExport?cfg.getExport(state):state}};
    return api}};
})();

(function(){
 var root=document.getElementById('cw-fx'),editing=false;
 var initMeta={"eyebrow": "CUSTOMER STORY", "title": "도입 기업들의\n생생한 후기", "desc": "FORGEX 솔루션을 도입한 기업들의 실제 변화를 확인하세요."},meta=Object.assign({},initMeta);
 var init=[{"type": "photo", "img": "https://hhhodo.github.io/forgex-landing/assets/images/luke-jones-tBvF46kmwBw-unsplash.jpg", "alt": "A커머스 인프라 운영"}, {"type": "quote", "cat": "클라우드 인프라", "quote": "장애 대응 시간이 절반으로 줄었습니다. 실시간 알림 덕분에 미리 대응할 수 있었어요.", "meta": "A커머스 인프라팀"}, {"type": "photo", "img": "https://hhhodo.github.io/forgex-landing/assets/images/conny-schneider-xuTJZ7uD7PI-unsplash.jpg", "alt": "B핀테크 보안 관제"}, {"type": "quote", "cat": "보안", "quote": "보안 관제 자동화 이후 침해 시도 대응 속도가 눈에 띄게 빨라졌습니다.", "meta": "B핀테크 보안팀"}, {"type": "photo", "img": "https://hhhodo.github.io/forgex-landing/assets/images/ales-nesetril-Im7lZjxeLhg-unsplash.jpg", "alt": "C스타트업 데이터 파이프라인"}, {"type": "quote", "cat": "데이터 플랫폼", "quote": "데이터 파이프라인 오류가 사실상 사라졌고, 분석 리드타임도 크게 단축됐습니다.", "meta": "C스타트업 데이터팀"}, {"type": "photo", "img": "https://hhhodo.github.io/forgex-landing/assets/images/vackground-com-agUC-v_D1iI-unsplash.jpg", "alt": "D SaaS 서비스 운영"}, {"type": "quote", "cat": "모니터링", "quote": "트래픽이 몰리는 시즌에도 서비스를 안정적으로 운영할 수 있게 됐습니다.", "meta": "D SaaS 대표"}];

   {key:'edit',type:'toggle',label:'텍스트 직접 편집 (이미지는 클릭해서 주소 변경)',default:false},
   {type:'button',label:"+ 후기 카드 추가",onClick:function(){data.push({type:'quote',cat:'분류',quote:'후기를 입력하세요.',meta:'회사명'});render()}},
   {type:'button',label:"+ 사진 카드 추가",onClick:function(){data.push({type:'photo',img:'',alt:''});render()}},
   {type:'button',label:"− 마지막 카드 삭제",onClick:function(){if(data.length>1)data.pop();render()}},
   {type:'group',label:"색상·여백"},
   {key:'bg',type:'color',label:"배경색",css:'--color-canvas',default:'#ffffff'},
   {key:'ink',type:'color',label:"글자색",css:'--text-default',default:'#262628'},
   {key:'sub',type:'color',label:"보조 글자색",css:'--text-subtle',default:'#5d5e5f'},
   {key:'pad',type:'range',label:"상하 여백",css:'--space-section',unit:'px',min:0,max:400,step:4,default:96},
   {type:'group',label:"흐름"},
   {key:'dir',type:'select',label:"흐르는 방향",attr:'data-dir',options:[{"value": "left", "label": "← 왼쪽으로"}, {"value": "right", "label": "→ 오른쪽으로"}],default:'left'},
   {key:'speed',type:'range',label:"한 바퀴 시간 (클수록 느림)",css:'--fx-speed',unit:'s',min:5,max:200,step:1,default:44},
   {key:'pause',type:'toggle',label:"마우스 올리면 멈춤",attr:'data-pause',default:true},
   {type:'group',label:"카드"},
   {key:'w',type:'range',label:"카드 너비",css:'--fx-w',unit:'px',min:160,max:600,step:5,default:300},
   {key:'h',type:'range',label:"카드 높이",css:'--fx-h',unit:'px',min:200,max:700,step:5,default:430},
   {key:'radius',type:'range',label:"카드 모서리",css:'--fx-radius',unit:'px',min:0,max:999,step:1,default:999},
   {key:'gap',type:'range',label:"카드 간격",css:'--fx-gap',unit:'px',min:0,max:80,step:1,default:32},
   {key:'head',type:'toggle',label:"제목 영역 표시",attr:'data-head',default:true}
  ]});
})();
</script>
<script>/* 커스텀 사이드바 (미리보기 전용): CWWidgets[id]에 붙어 숫자/색상/선택/토글 입력으로 실시간 조작 */
(function(){
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e}
  function mount(id){
    var w=window.CWWidgets&&CWWidgets[id];if(!w)return;
    var sb=el('aside','cw-sb'),body=el('div','cw-sb__body');
    sb.appendChild(el('div','cw-sb__head','커스텀<small>숫자·색상을 입력하면 바로 반영됩니다</small>'));sb.appendChild(body);
    var sync=[];
    w.controls.forEach(function(c){
      if(c.type==='group'){body.appendChild(el('div','cw-sb__g',c.label));return}
      if(c.type==='button'){var b=el('div','cw-sb__b');var bt=el('button','',c.label);bt.type='button';bt.onclick=c.onClick;b.appendChild(bt);body.appendChild(b);return}
      var row=el('div','cw-sb__r'),lab=el('label','',c.label);row.appendChild(lab);var inp,hex;
      if(c.type==='select'){inp=el('select');c.options.forEach(function(o){var op=el('option','',o.label||o);op.value=o.value!==undefined?o.value:o;inp.appendChild(op)})}
      else if(c.type==='toggle'){inp=el('input');inp.type='checkbox'}
      else if(c.type==='color'){inp=el('input');inp.type='color';hex=el('input');hex.type='text';hex.maxLength=7}
      else{inp=el('input');inp.type='number';inp.min=c.min;inp.max=c.max;inp.step=c.step||1;inp.inputMode='decimal'}
      function show(){var v=w.state[c.key];if(c.type==='toggle')inp.checked=!!v;else inp.value=v;if(hex)hex.value=v}
      function put(v){
        if(c.type==='range'){if(v===''||isNaN(Number(v)))return;v=Math.min(c.max,Math.max(c.min,Number(v)))}
        w.set(c.key,v)}
      inp.addEventListener(c.type==='select'||c.type==='toggle'?'change':'input',function(){put(c.type==='toggle'?inp.checked:inp.value);if(hex)hex.value=inp.value});
      if(c.type==='range')inp.addEventListener('blur',show);
      if(hex)hex.addEventListener('change',function(){if(/^#[0-9a-f]{6}$/i.test(hex.value)){put(hex.value);inp.value=hex.value}else show()});
      row.appendChild(inp);if(hex)row.appendChild(hex);if(c.type==='range'&&c.unit)row.appendChild(el('span','u',c.unit));
      body.appendChild(row);sync.push(show);show();
    });
    var bar=el('div','cw-sb__b');bar.innerHTML='<button type="button" data-a="r">초기화</button><button type="button" class="p" data-a="c">설정값 복사</button>';
    bar.onclick=function(e){var a=e.target.dataset.a;if(a==='r'){w.reset();sync.forEach(function(f){f()})}
      if(a==='c'){var ex=w.export(),st={};Object.keys(w.state).forEach(function(k){if(k==='edit')return;var v=w.state[k];st[k]=v===true?1:v===false?0:v});
        var txt="window.CW_CONFIG['"+id+"'] = "+JSON.stringify({settings:st,meta:ex.meta,[Object.keys(ex).filter(function(k){return k!=='settings'&&k!=='meta'})[0]]:ex[Object.keys(ex).filter(function(k){return k!=='settings'&&k!=='meta'})[0]]},null,2)+';';
        (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('복사됨 — widget.html 상단 CW_CONFIG에 붙여넣기')},function(){window.prompt('복사하세요',txt)})}};
    body.appendChild(bar);document.body.appendChild(sb);
    if(!/[?&]nosidebar/.test(location.search))document.body.classList.add('cw-has-sidebar');else sb.style.display='none';
  }
  function toast(m){var t=el('div','cw-sb__t',m);document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}
  window.CWSidebar={mount:mount};
})();

CWSidebar.mount('cw-fx');</script></body></html>
