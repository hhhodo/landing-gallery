<style>body{margin:0;background:#fff}body.cw-has-sidebar{margin-right:304px!important}
.cw-sb{position:fixed;top:0;right:0;bottom:0;width:304px;z-index:9999;background:#fff;color:#1d1d1f;border-left:1px solid #ececef;display:flex;flex-direction:column;font:13px/1.35 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.cw-sb *{box-sizing:border-box}
.cw-sb__head{flex:none;padding:18px 20px 14px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.cw-sb__body{flex:1;overflow:auto;padding:0 20px 16px}

.cw-sb__g{margin:22px 0 6px;padding-top:16px;border-top:1px solid #f0f0f2;font-size:11px;font-weight:700;letter-spacing:.06em;color:#9a9aa2}
.cw-sb__g:first-child{margin-top:4px;padding-top:0;border-top:0}
.cw-sb__r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}

.cw-sb__r.col{flex-direction:column;align-items:stretch;gap:6px;padding:6px 0}
.cw-sb__r.hide,.cw-sb__g.hide{display:none}
/* 숫자 입력 */
.cw-sb__n{position:relative;width:96px}
.cw-sb__n input{width:100%;height:32px;padding:0 28px 0 10px;border:1px solid #e3e3e8;border-radius:8px;background:#fafafb;font:inherit;font-size:13px;text-align:right;color:#1d1d1f;transition:border-color .15s,background .15s}
.cw-sb__n input:focus{outline:0;border-color:#1d1d1f;background:#fff}
.cw-sb__n i{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:#9a9aa2;pointer-events:none}
.cw-sb__n input::-webkit-outer-spin-button,.cw-sb__n input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.cw-sb__n input[type=number]{-moz-appearance:textfield}
/* 색상 */
.cw-sb__c{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 4px;border:1px solid #e3e3e8;border-radius:8px;background:#fafafb}
.cw-sb__c input[type=color]{width:22px;height:22px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;-webkit-appearance:none;appearance:none}
.cw-sb__c input[type=color]::-webkit-color-swatch-wrapper{padding:0}.cw-sb__c input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.12);border-radius:50%}
.cw-sb__c input[type=text]{width:66px;border:0;background:none;font:inherit;font-size:12px;color:#4a4a52;text-transform:uppercase;padding:0}.cw-sb__c input[type=text]:focus{outline:0;color:#1d1d1f}
/* 선택 버튼 (드롭다운 대신) */
.cw-sb__seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;background:#f1f1f4;border-radius:10px}
.cw-sb__seg button{flex:1 1 auto;min-width:0;height:28px;padding:0 10px;border:0;border-radius:7px;background:transparent;font:inherit;font-size:12.5px;color:#6a6a72;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.cw-sb__seg button:hover{color:#1d1d1f}
.cw-sb__seg button.on{background:#fff;color:#1d1d1f;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* 스위치 */
.cw-sb__sw{position:relative;width:38px;height:22px;flex:none}
.cw-sb__sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.cw-sb__sw span{position:absolute;inset:0;border-radius:11px;background:#d8d8de;transition:background .2s}
.cw-sb__sw span::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.cw-sb__sw input:checked+span{background:#1d1d1f}.cw-sb__sw input:checked+span::after{transform:translateX(16px)}
/* 버튼 */
.cw-sb__b{display:flex;gap:6px;margin:8px 0 2px}
.cw-sb__b button{flex:1;height:32px;border:1px solid #e3e3e8;background:#fff;border-radius:8px;font:inherit;font-size:12.5px;color:#1d1d1f;cursor:pointer;transition:background .15s}
.cw-sb__b button:hover{background:#f6f6f8}
.cw-sb__foot{flex:none;display:flex;gap:8px;padding:12px 20px 16px;border-top:1px solid #ececef;background:#fff}
.cw-sb__foot button{flex:1;height:38px;border-radius:10px;border:1px solid #e3e3e8;background:#fff;font:inherit;font-size:13px;cursor:pointer}
.cw-sb__foot button.p{background:#1d1d1f;border-color:#1d1d1f;color:#fff;font-weight:600}
.cw-sb__t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:9px 16px;border-radius:999px;font:13px 'Pretendard',sans-serif;z-index:10000}
[contenteditable=true]{outline:1px dashed rgba(90,90,255,.7);outline-offset:2px;cursor:text}
@media(max-width:760px){body.cw-has-sidebar{margin-right:0!important;padding-bottom:50vh}.cw-sb{top:auto;width:auto;left:0;height:48vh;border-left:0;border-top:1px solid #ececef}}
</style></head><body>

      {

<style>
.fl{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif}
.fl{--color-primary-050:#f6f7f7; --color-primary-100:#e1e1e3; --color-primary-200:#c5c6c8;
  --color-primary-300:#a2a3a5; --color-primary-400:#949597; --color-primary-500:#838486;
  --color-primary-600:#5d5e5f; --color-primary-700:#4c4c4e; --color-primary-800:#393a3b;
  --color-primary-900:#262628; --color-canvas:#fff; --color-placeholder:#d9d9d9;

  --text-default:var(--color-primary-900); --text-subtle:var(--color-primary-600);
  --text-disabled:var(--color-primary-400);
  --text-default-inverse:#fff; --text-subtle-inverse:var(--color-primary-200);

  
  --fs-display-lg:102px; --fs-display-md:96px; --fs-display-sm:80px;
  --fs-h0:64px; --fs-h1:56px; --fs-h2:40px; --fs-h3:32px;
  --fs-body-1:20px; --fs-body-2:18px;
  --fs-badge:14px;
  --fw-strong:700; --fw-base:400;
  --tracking-kr:-0.025em; --display-tracking:-0.02em;
  --lh-display:1.25; --lh-h0:1.25; --lh-h1:1.3; --lh-h2:1.35; --lh-h3:1.4; --lh-body:1.5;
  --measure:38ch;

  
  --radius-0:0px; --radius-sm:12px; --radius-md:24px; --radius-lg:32px; --radius-circle:999px;
  --border-0:none; --border-1:1px solid var(--color-primary-100); --border-2:2px solid var(--color-primary-900);

  
  --container-narrow:1280px; --container-default:1440px; --container-wide:1600px;
  --gutter:80px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
  --space-7:48px; --space-8:64px; --space-9:96px; --space-10:120px; --space-11:160px; --space-12:200px; --space-13:240px;
  --space-section:var(--space-11);
  --grid-gutter-0:0px; --grid-gutter-sm:8px; --grid-gutter-md:16px; --grid-gutter-lg:24px;}
.fl *{box-sizing:border-box;margin:0;padding:0;}
.fl{font-family:'Pretendard',sans-serif;font-weight:var(--fw-base);
  font-size:var(--fs-body-1);line-height:var(--lh-body);letter-spacing:var(--tracking-kr);
  color:var(--text-default);background:var(--color-canvas);}
.fl h1,.fl .h0{font-size:var(--fs-h0);font-weight:var(--fw-strong);line-height:var(--lh-h0);letter-spacing:var(--display-tracking);}
.fl h2,.fl .h1{font-size:var(--fs-h1);font-weight:var(--fw-strong);line-height:var(--lh-h1);}
.fl .container{width:100%;max-width:var(--container-default);margin-inline:auto;padding-inline:var(--fl-gutter,var(--gutter));}
.fl .container--wide{max-width:var(--container-wide);}
.fl .container--narrow{max-width:var(--container-narrow);}
.fl .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--grid-gutter-lg);}
.fl .grid--flush{gap:var(--grid-gutter-0);}
.fl .grid--tight{gap:var(--grid-gutter-sm);}
.fl .grid--snug{gap:var(--grid-gutter-md);}
.fl .section{padding-block:var(--space-section);}
.fl .img{background:var(--color-placeholder);display:block;width:100%;}
.fl .img--16-9{aspect-ratio:var(--fl-ratio,16/9);}
.fl .img--4-3{aspect-ratio:4/3;}
.fl .img--1-1{aspect-ratio:1/1;}
@media (max-width:1024px){.fl{--gutter:40px;}.fl .grid{gap:var(--grid-gutter-md);}}
@media (max-width:768px){.fl{--gutter:20px;
    --fs-display-lg:48px; --fs-display-md:44px; --fs-display-sm:40px;
    --fs-h0:32px; --fs-h1:28px; --fs-h2:24px; --fs-h3:20px;
    --fs-body-1:18px; --fs-body-2:16px;
    --space-section:var(--space-9);}}
.fl{--color-canvas:#fbfbfa;

  --fw-strong:600; --fw-base:400;
  --space-section:var(--space-12);
  --nav-h:76px;}
.fl{background:var(--color-canvas);}
.fl .container,.fl .container--wide,.fl .container--narrow{max-width:none;}
.fl .img{object-fit:cover;height:100%;}
.fl h2,.fl .h1{font-size:var(--fs-h2);line-height:var(--lh-h2);}
.fl .gcell{min-width:0;}
.fl .spotlight{background:var(--color-primary-050);}
.fl .spotlight__panel{padding-block-start:var(--space-5);}
.fl .spotlight__list{display:flex;flex-direction:column;}
.fl .spotlight__item{display:flex;align-items:center;width:100%;background:none;border:none;
  border-block-end:var(--border-1);text-align:left;font:inherit;color:inherit;cursor:pointer;
  padding-block:var(--space-5);font-size:var(--fs-body-2);transition:opacity .2s ease;}
.fl .spotlight__item:hover{opacity:.55;}
.fl .spotlight__item--active{font-weight:var(--fw-strong);border-bottom:var(--border-2);}
.fl .spotlight__title{margin-block:0 var(--space-2);}
.fl .spotlight__body{color:var(--text-subtle);margin-block-end:var(--space-5);white-space:nowrap;}
.fl .spotlight__frame{border-radius:var(--radius-0);overflow:hidden;border:var(--border-1);}
@media (max-width:1024px){.fl .spotlight__body{white-space:normal;}}
@media (max-width:768px){.fl{--space-section:84px;}.fl .grid:not(.grid--snug):not(.grid--tight):not(.grid--flush){gap:var(--space-7) var(--grid-gutter-md);}.fl .grid--snug{gap:var(--space-8) var(--grid-gutter-md);}.fl .gcell{grid-column:1/13!important;order:initial!important;}.fl .gcell--2up{grid-column:span 6!important;}.fl .spotlight__panel{padding-block-start:0;}.fl .spotlight__list{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
    gap:var(--space-6);border-block-end:var(--border-1);scrollbar-width:none;}.fl .spotlight__list::-webkit-scrollbar{display:none;}.fl .spotlight__item{width:auto;flex:none;border-block-end:none;white-space:nowrap;
    padding-block:var(--space-3);padding-inline:0;}.fl .spotlight__item--active{border-bottom:var(--border-2);}}
@media (max-width:600px){.fl .gcell--2up{grid-column:1/13!important;}}
.fl{--fl-img-radius:0px;--fl-fit:cover;--fl-gap-base:0px}
@media(max-width:1024px){.fl .container{padding-inline:var(--gutter)}}
/* ── 탭 위치 (탭 영역 너비는 3열 고정) ── */
.fl .fl-tabs{grid-row:1}.fl .fl-content{grid-row:1}
.fl[data-pos=left] .fl-tabs{grid-column:1/4}.fl[data-pos=left] .fl-content{grid-column:4/13}
.fl[data-pos=right] .fl-tabs{grid-column:10/13}.fl[data-pos=right] .fl-content{grid-column:1/10}
.fl[data-pos=top] .fl-tabs{grid-column:1/13;grid-row:1}.fl[data-pos=top] .fl-content{grid-column:1/13;grid-row:2}
.fl[data-pos=top] .spotlight__panel{padding-block-start:0}
.fl[data-pos=top] .fl-tabs{padding-block-start:0}
/* 상단 탭 = 가로 나열 */
.fl[data-pos=top] .spotlight__list{flex-direction:row;flex-wrap:wrap}
.fl[data-pos=top] .spotlight__item{width:auto;flex:none;white-space:nowrap}
.fl[data-pos=top]{--fl-gap-base:24px}
@media(max-width:768px){.fl .fl-tabs,.fl .fl-content{grid-row:auto!important}}
/* ── 탭 디자인 ── */
.fl{--fl-pill-py:8px;--fl-pill-px:16px;--fl-tab-gap:0px;--fl-tab-fs:var(--fs-body-2);--fl-tab-py:var(--space-5);--fl-tab-px:20px;--fl-tab-radius:12px;--fl-tab-line:#e1e1e3;--fl-tab-active-bg:#262628;--fl-tab-active-fg:#ffffff;--fl-tab-accent:#262628}
.fl .spotlight__list{gap:calc(var(--fl-tab-gap) + var(--fl-gap-base))}
.fl .spotlight__item{padding-block:var(--fl-tab-py);font-size:var(--fl-tab-fs);transition:background .2s,color .2s,border-color .2s,opacity .2s}
.fl .spotlight__item--active{border-bottom:2px solid var(--fl-tab-accent)}
.fl[data-tabstyle=pill]{--fl-gap-base:8px}.fl[data-tabstyle=box]{--fl-gap-base:8px}
.fl[data-tabstyle=pill][data-pos=top],.fl[data-tabstyle=box][data-pos=top]{--fl-gap-base:8px}
.fl[data-tabstyle=pill] .spotlight__item,.fl[data-tabstyle=box] .spotlight__item{border:1px solid transparent;border-block-end:1px solid transparent;padding-inline:var(--fl-tab-px)}
.fl[data-tabstyle=pill] .spotlight__item{border-radius:999px;width:auto;align-self:flex-start;flex:none;white-space:nowrap;padding-block:var(--fl-pill-py);padding-inline:var(--fl-pill-px)}
.fl[data-tabstyle=box] .spotlight__item{border-color:var(--fl-tab-line);border-radius:var(--fl-tab-radius)}
.fl[data-tabstyle=pill] .spotlight__item--active,.fl[data-tabstyle=box] .spotlight__item--active{background:var(--fl-tab-active-bg);color:var(--fl-tab-active-fg);border-color:var(--fl-tab-active-bg)}
.fl[data-tabstyle=pill] .spotlight__item:hover,.fl[data-tabstyle=box] .spotlight__item:hover{opacity:1;background:rgba(0,0,0,.05)}
.fl[data-tabstyle=pill] .spotlight__item--active:hover,.fl[data-tabstyle=box] .spotlight__item--active:hover{background:var(--fl-tab-active-bg)}
.fl[data-tabstyle=text] .spotlight__item{border:none}
.fl[data-tabstyle=text] .spotlight__item--active{border:none;color:var(--fl-tab-accent)}

<script>/* 커스텀 사이드바 (미리보기 전용) */
(function(){
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e}
  function mount(id){
    var w=window.CWWidgets&&CWWidgets[id];if(!w)return;
    var sb=el('aside','cw-sb'),body=el('div','cw-sb__body'),rows=[];
    sb.appendChild(el('div','cw-sb__head','커스텀'));sb.appendChild(body);
    function visible(c){if(!c.when)return true;var v=String(w.state[c.when.key]);return c.when.is.map(String).indexOf(v)>-1}
    function refresh(){
      var g=null,any=false;
      rows.forEach(function(r){
        if(r.isGroup){if(g)g.el.classList.toggle('hide',!any);g=r;any=false;return}
        var ok=visible(r.c);r.el.classList.toggle('hide',!ok);if(ok)any=true});
      if(g)g.el.classList.toggle('hide',!any)}
    var syncs=[];
    w.controls.forEach(function(c){
      if(c.type==='group'){var ge=el('div','cw-sb__g',c.label);body.appendChild(ge);rows.push({isGroup:true,el:ge});return}
      if(c.type==='button'){var b=el('div','cw-sb__b');var bt=el('button','',c.label);bt.type='button';bt.onclick=c.onClick;b.appendChild(bt);body.appendChild(b);return}
      var seg=c.type==='select'&&c.options.length<=6;
      var row=el('div','cw-sb__r'+(seg?' col':''));row.appendChild(el('label','',c.label));
      var ctl;
      if(seg){
        ctl=el('div','cw-sb__seg');
        var btns=c.options.map(function(o){var v=o.value!==undefined?o.value:o,bt=el('button','',o.label||o);bt.type='button';bt.dataset.v=v;bt.onclick=function(){w.set(c.key,v);show();refresh()};ctl.appendChild(bt);return bt});
        var show=function(){btns.forEach(function(b){b.classList.toggle('on',b.dataset.v===String(w.state[c.key]))})};
      }else if(c.type==='select'){
        ctl=el('select');c.options.forEach(function(o){var op=el('option','',o.label||o);op.value=o.value!==undefined?o.value:o;ctl.appendChild(op)});
        ctl.onchange=function(){w.set(c.key,ctl.value);refresh()};var show=function(){ctl.value=w.state[c.key]};
      }else if(c.type==='toggle'){
        ctl=el('label','cw-sb__sw','<input type="checkbox"><span></span>');var cb=ctl.querySelector('input');
        cb.onchange=function(){w.set(c.key,cb.checked);refresh()};var show=function(){cb.checked=!!w.state[c.key]};
      }else if(c.type==='color'){
        ctl=el('div','cw-sb__c','<input type="color"><input type="text" maxlength="7">');var ci=ctl.children[0],ht=ctl.children[1];
        ci.oninput=function(){ht.value=ci.value;w.set(c.key,ci.value)};
        ht.onchange=function(){if(/^#[0-9a-f]{6}$/i.test(ht.value)){ci.value=ht.value;w.set(c.key,ht.value)}else show()};
        var show=function(){ci.value=w.state[c.key];ht.value=w.state[c.key]};
      }else{
        ctl=el('div','cw-sb__n','<input type="number" min="'+c.min+'" max="'+c.max+'" step="'+(c.step||1)+'" inputmode="decimal">'+(c.unit?'<i>'+c.unit+'</i>':''));var ni=ctl.querySelector('input');
        ni.oninput=function(){if(ni.value===''||isNaN(Number(ni.value)))return;w.set(c.key,Math.min(c.max,Math.max(c.min,Number(ni.value))))};
        ni.onblur=function(){show()};var show=function(){ni.value=w.state[c.key]};
      }
      row.appendChild(ctl);body.appendChild(row);rows.push({c:c,el:row});syncs.push(show);show();
    });
    var foot=el('div','cw-sb__foot','<button type="button" data-a="r">초기화</button><button type="button" class="p" data-a="c">설정값 복사</button>');
    foot.onclick=function(e){var a=e.target.dataset.a;if(a==='r'){w.reset();syncs.forEach(function(f){f()});refresh()}
      if(a==='c'){var ex=w.export(),st={};Object.keys(w.state).forEach(function(k){if(k==='edit')return;var v=w.state[k];st[k]=v===true?1:v===false?0:v});
        var lk=Object.keys(ex).filter(function(k){return k!=='settings'&&k!=='meta'})[0],o={settings:st,meta:ex.meta};o[lk]=ex[lk];
        var txt="window.CW_CONFIG['"+id+"'] = "+JSON.stringify(o,null,2)+';';
        (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('복사됨 · widget.html 상단 CW_CONFIG에 붙여넣기')},function(){window.prompt('복사하세요',txt)})}};
    sb.appendChild(foot);document.body.appendChild(sb);refresh();
    if(!/[?&]nosidebar/.test(location.search))document.body.classList.add('cw-has-sidebar');else sb.style.display='none';
  }
  function toast(m){var t=el('div','cw-sb__t',m);document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}
  window.CWSidebar={mount:mount};
})();
