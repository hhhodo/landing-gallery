<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pricing Plans Widget</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="shared/panel.css">
<style>
body{margin:0;font-family:'Pretendard',sans-serif;background:#f4f4f2}
.pw{--pw-bg:#f6f3ee;--pw-card:#ffffff;--pw-text:#1b1b1b;--pw-sub:#6b6b6b;--pw-line:#e2ddd4;--pw-accent:#1b1b1b;--pw-accent-text:#ffffff;--pw-radius:20px;--pw-cols:3;--pw-gap:24px;--pw-pad:96px;--pw-width:1160px;
 background:var(--pw-bg);color:var(--pw-text);padding:var(--pw-pad) 20px}
.pw__in{max-width:var(--pw-width);margin:0 auto}
.pw__eyebrow{font-size:13px;letter-spacing:.08em;color:var(--pw-sub);margin:0 0 12px}
.pw__title{font-size:44px;line-height:1.2;margin:0 0 12px;font-weight:700}
.pw__note{color:var(--pw-sub);margin:0 0 48px}
.pw[data-align=center] .pw__head{text-align:center}
.pw__grid{display:grid;grid-template-columns:repeat(var(--pw-cols),1fr);gap:var(--pw-gap);align-items:stretch}
.pw__card{position:relative;display:flex;flex-direction:column;background:var(--pw-card);border:1px solid var(--pw-line);border-radius:var(--pw-radius);padding:32px}
.pw__card.is-featured{background:var(--pw-accent);color:var(--pw-accent-text);border-color:var(--pw-accent)}
.pw[data-lift=true] .pw__card.is-featured{transform:translateY(-12px)}
.pw__badge{align-self:flex-start;font-size:12px;letter-spacing:.08em;padding:4px 10px;border-radius:999px;border:1px solid currentColor;margin-bottom:16px}
.pw__name{font-size:26px;margin:0 0 8px;font-weight:700}
.pw__desc{margin:0 0 24px;font-size:15px;line-height:1.6;opacity:.7;min-height:48px}
.pw__price{display:flex;align-items:baseline;gap:6px;margin-bottom:24px}
.pw__price b{font-size:34px}.pw__price span{opacity:.6;font-size:14px}
.pw__feat{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:10px;flex:1;font-size:15px}
.pw__feat li{display:flex;gap:8px;align-items:flex-start}
.pw__feat li:before{content:"✓";flex:none}
.pw__btn{display:block;text-align:center;text-decoration:none;font-weight:600;padding:14px;border-radius:calc(var(--pw-radius)/2);border:1px solid currentColor;color:inherit}
.pw__card.is-featured .pw__btn{background:var(--pw-accent-text);color:var(--pw-accent);border-color:var(--pw-accent-text)}
.pw[data-badge=false] .pw__badge{display:none}
.pw[data-feat=false] .pw__feat{display:none}
.pw__card.is-featured .pw__feat li:before{content:"✓"}
@media(max-width:900px){.pw__grid{grid-template-columns:1fr}.pw[data-lift=true] .pw__card.is-featured{transform:none}}
</style></head><body>
<section class="pw" id="pw" data-align="left" data-lift="true" data-badge="true" data-feat="true">
 <div class="pw__in">
  <div class="pw__head"><p class="pw__eyebrow" data-g="eyebrow"></p><h2 class="pw__title" data-g="title"></h2><p class="pw__note" data-g="note"></p></div>
  <div class="pw__grid" id="grid"></div>
 </div>
</section>
<script src="shared/panel.js"></script>
<script>
(function(){
 var root=document.getElementById('pw'),grid=document.getElementById('grid');
 var initMeta={eyebrow:'PLANS',title:'나에게 맞는 플랜을 고르세요',note:'모든 플랜은 언제든 변경하거나 해지할 수 있습니다.'};
 var meta=Object.assign({},initMeta);
 var init=[
  {badge:'LIGHT',name:'라이트',desc:'가볍게 시작하고 싶은 분을 위한 격월 플랜.',price:'29,000원',unit:'/ 격월',features:'오브제 2~3종 큐레이션\n무료 배송\n언제든 해지 가능',cta:'라이트 시작하기',featured:false},
  {badge:'STANDARD',name:'스탠다드',desc:'가장 많이 선택하는 균형 잡힌 월간 플랜.',price:'49,000원',unit:'/ 월',features:'오브제 3~5종 큐레이션\n무료 배송 · 반품\n1:1 스타일 상담 월 1회\n언제든 해지 가능',cta:'스탠다드 시작하기',featured:true},
  {badge:'PREMIUM',name:'프리미엄',desc:'아웃도어까지 폭넓게 경험하고 싶은 분께.',price:'79,000원',unit:'/ 월',features:'오브제 5종 이상 큐레이션\n무료 배송 · 반품\n전담 스타일리스트\n언제든 해지 가능',cta:'프리미엄 시작하기',featured:false}];
 var data=JSON.parse(JSON.stringify(init)),editing=false;
 function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
 function render(){
  root.querySelectorAll('[data-g]').forEach(function(n){n.textContent=meta[n.dataset.g]});
  grid.innerHTML=data.map(function(d,i){return '<article class="pw__card'+(d.featured?' is-featured':'')+'"><span class="pw__badge" data-i="'+i+'" data-f="badge">'+esc(d.badge)+'</span><h3 class="pw__name" data-i="'+i+'" data-f="name">'+esc(d.name)+'</h3><p class="pw__desc" data-i="'+i+'" data-f="desc">'+esc(d.desc)+'</p><div class="pw__price"><b data-i="'+i+'" data-f="price">'+esc(d.price)+'</b><span data-i="'+i+'" data-f="unit">'+esc(d.unit)+'</span></div><ul class="pw__feat">'+(editing?'<li style="display:block;white-space:pre-line" data-i="'+i+'" data-f="features">'+esc(d.features)+'</li>':d.features.split('\n').filter(Boolean).map(function(f){return '<li>'+esc(f)+'</li>'}).join(''))+'</ul><a class="pw__btn" href="#" data-i="'+i+'" data-f="cta">'+esc(d.cta)+'</a></article>'}).join('');
  grid.querySelectorAll('.pw__btn').forEach(function(a){a.onclick=function(e){e.preventDefault()}});
  CWPanel.setEditable(root,editing);
 }
 CWPanel.bindEdit(root,data,meta);
 CWPanel.mount({title:'요금제 위젯 설정',root:root,defaults:{edit:false},
  getExport:function(s){return{settings:s,meta:meta,plans:data}},
  onReset:function(){data.length=0;JSON.parse(JSON.stringify(init)).forEach(function(d){data.push(d)});Object.assign(meta,initMeta);editing=false;render()},
  onChange:function(s,k){if(k==='edit'||k===null)editing=!!s.edit;render()},
  controls:[
   {type:'group',label:'콘텐츠'},
   {key:'edit',type:'toggle',label:'텍스트 직접 편집',default:false},
   {type:'button',label:'+ 플랜 추가',onClick:function(){data.push({badge:'NEW',name:'새 플랜',desc:'설명을 입력하세요.',price:'0원',unit:'/ 월',features:'혜택 1\n혜택 2',cta:'시작하기',featured:false});render()}},
   {type:'button',label:'− 마지막 플랜 삭제',onClick:function(){data.pop();render()}},
   {type:'button',label:'★ 강조 플랜 순환',onClick:function(){var i=data.findIndex(function(d){return d.featured});data.forEach(function(d){d.featured=false});data[(i+1)%data.length].featured=true;render()}},
   {type:'group',label:'표시'},
   {key:'badge',type:'toggle',label:'뱃지 표시',attr:'data-badge',default:true},
   {key:'feat',type:'toggle',label:'혜택 목록 표시',attr:'data-feat',default:true},
   {key:'lift',type:'toggle',label:'강조 카드 띄우기',attr:'data-lift',default:true},
   {key:'align',type:'select',label:'제목 정렬',attr:'data-align',options:[{value:'left',label:'왼쪽'},{value:'center',label:'가운데'}],default:'left'},
   {type:'group',label:'스타일'},
   {key:'cols',type:'range',label:'열 수',css:'--pw-cols',min:1,max:4,default:3},
   {key:'bg',type:'color',label:'섹션 배경',css:'--pw-bg',default:'#f6f3ee'},
   {key:'card',type:'color',label:'카드 배경',css:'--pw-card',default:'#ffffff'},
   {key:'text',type:'color',label:'글자색',css:'--pw-text',default:'#1b1b1b'},
   {key:'accent',type:'color',label:'강조색',css:'--pw-accent',default:'#1b1b1b'},
   {key:'atext',type:'color',label:'강조 글자색',css:'--pw-accent-text',default:'#ffffff'},
   {key:'line',type:'color',label:'테두리색',css:'--pw-line',default:'#e2ddd4'},
   {key:'radius',type:'range',label:'모서리',css:'--pw-radius',unit:'px',min:0,max:40,default:20},
   {key:'gap',type:'range',label:'카드 간격',css:'--pw-gap',unit:'px',min:8,max:56,default:24},
   {key:'pad',type:'range',label:'상하 여백',css:'--pw-pad',unit:'px',min:16,max:200,step:4,default:96}
  ]});
})();
</script></body></html>
