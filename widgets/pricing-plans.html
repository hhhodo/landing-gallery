<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>요금제 위젯</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>body{margin:0;background:#f4f4f2}body.cw-has-sidebar{margin-right:320px!important}
.cw-sb{position:fixed;top:0;right:0;bottom:0;width:320px;z-index:9999;background:#fff;color:#1a1a1a;border-left:1px solid #e3e3e3;overflow:auto;font:14px/1.4 'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif}
.cw-sb *{box-sizing:border-box}
.cw-sb__head{position:sticky;top:0;background:#fff;padding:16px;border-bottom:1px solid #eee;font-weight:700;font-size:15px;z-index:1}
.cw-sb__head small{display:block;font-weight:400;color:#888;font-size:12px;margin-top:2px}
.cw-sb__body{padding:4px 16px 24px}
.cw-sb__g{margin:18px 0 4px;font-size:11px;font-weight:700;letter-spacing:.05em;color:#888}
.cw-sb__r{display:flex;align-items:center;gap:8px;margin:8px 0}
.cw-sb__r>label{flex:1;color:#333}
.cw-sb__r input[type=number]{width:92px;font:inherit;padding:6px 8px;border:1px solid #ccc;border-radius:6px;text-align:right}
.cw-sb__r .u{width:24px;color:#888;font-size:12px}
.cw-sb__r input[type=color]{width:36px;height:30px;padding:0;border:1px solid #ccc;border-radius:6px;background:none}
.cw-sb__r input[type=text]{width:84px;font:inherit;padding:6px 8px;border:1px solid #ccc;border-radius:6px}
.cw-sb__r select{font:inherit;padding:6px 8px;border:1px solid #ccc;border-radius:6px;max-width:150px}
.cw-sb__r input[type=checkbox]{width:18px;height:18px}
.cw-sb__b{display:flex;gap:6px;margin:8px 0}
.cw-sb__b button{flex:1;font:inherit;font-size:13px;padding:8px;border:1px solid #1a1a1a;background:#fff;border-radius:8px;cursor:pointer}
.cw-sb__b button.p{background:#1a1a1a;color:#fff}
.cw-sb__t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:8px 14px;border-radius:999px;font:13px 'Pretendard',sans-serif;z-index:10000}
[contenteditable=true]{outline:1px dashed rgba(90,90,255,.7);outline-offset:2px;cursor:text}
@media(max-width:760px){body.cw-has-sidebar{margin-right:0!important;padding-bottom:45vh}.cw-sb{top:auto;width:auto;left:0;height:42vh;border-left:0;border-top:1px solid #e3e3e3}}
</style></head><body>
<!-- 요금제 커스텀 위젯 · 코드 삽입/커스텀 위젯에 통째로 붙여넣기 (외부 의존성 없음 · 폰트는 사이트 폰트 사용) -->
<script>
/* ============================================================
   요금제 위젯 설정값 — 아래 숫자/값만 고치면 위젯에 반영됩니다.
   ============================================================ */
window.CW_CONFIG = window.CW_CONFIG || {};
window.CW_CONFIG['cw-pw'] = {
  settings: {
    badge: 1,                 // 뱃지 표시 (1=켜기, 0=끄기)
    feat: 1,                  // 혜택 목록 표시 (1=켜기, 0=끄기)
    lift: 1,                  // 강조 카드 띄우기 (1=켜기, 0=끄기)
    align: "left",            // 제목 정렬 : left=왼쪽 | center=가운데
    cols: 3,                  // 열 수 (숫자 · 1~4)
    bg: "#f6f3ee",            // 섹션 배경 (색상 hex)
    card: "#ffffff",          // 카드 배경 (색상 hex)
    text: "#1b1b1b",          // 글자색 (색상 hex)
    accent: "#1b1b1b",        // 강조색 (색상 hex)
    atext: "#ffffff",         // 강조 글자색 (색상 hex)
    line: "#e2ddd4",          // 테두리색 (색상 hex)
    radius: 20,               // 모서리 (px · 0~40)
    gap: 24,                  // 카드 간격 (px · 8~56)
    pad: 96,                  // 상하 여백 (px · 16~200)
  },
  // 문구 (따옴표 안의 글자만 수정 · 항목 추가/삭제는 { } 블록 단위로)
  meta: {
      "eyebrow": "PLANS",
      "title": "나에게 맞는 플랜을 고르세요",
      "note": "모든 플랜은 언제든 변경하거나 해지할 수 있습니다."
  },
  plans: [
      {
          "badge": "LIGHT",
          "name": "라이트",
          "desc": "가볍게 시작하고 싶은 분을 위한 격월 플랜.",
          "price": "29,000원",
          "unit": "/ 격월",
          "features": "오브제 2~3종 큐레이션\n무료 배송\n언제든 해지 가능",
          "cta": "라이트 시작하기",
          "featured": false
      },
      {
          "badge": "STANDARD",
          "name": "스탠다드",
          "desc": "가장 많이 선택하는 균형 잡힌 월간 플랜.",
          "price": "49,000원",
          "unit": "/ 월",
          "features": "오브제 3~5종 큐레이션\n무료 배송 · 반품\n1:1 스타일 상담 월 1회\n언제든 해지 가능",
          "cta": "스탠다드 시작하기",
          "featured": true
      },
      {
          "badge": "PREMIUM",
          "name": "프리미엄",
          "desc": "아웃도어까지 폭넓게 경험하고 싶은 분께.",
          "price": "79,000원",
          "unit": "/ 월",
          "features": "오브제 5종 이상 큐레이션\n무료 배송 · 반품\n전담 스타일리스트\n언제든 해지 가능",
          "cta": "프리미엄 시작하기",
          "featured": false
      }
  ]
};
</script>
<style>
.pw{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif}
.pw{--pw-bg:#f6f3ee;--pw-card:#ffffff;--pw-text:#1b1b1b;--pw-sub:#6b6b6b;--pw-line:#e2ddd4;--pw-accent:#1b1b1b;--pw-accent-text:#ffffff;--pw-radius:20px;--pw-cols:3;--pw-gap:24px;--pw-pad:96px;--pw-width:1160px;
 background:var(--pw-bg);color:var(--pw-text);padding:var(--pw-pad) 20px}
.pw__in{max-width:var(--pw-width);margin:0 auto}
.pw__eyebrow{font-size:13px;letter-spacing:.08em;color:var(--pw-sub);margin:0 0 12px}
.pw__title{font-size:44px;line-height:1.2;margin:0 0 12px;font-weight:700}
.pw__note{color:var(--pw-sub);margin:0 0 48px}
.pw[data-align=center] .pw__head{text-align:center}
.pw__grid{display:grid;grid-template-columns:repeat(var(--pw-cols),1fr);gap:var(--pw-gap);align-items:stretch}
.pw__card{position:relative;display:flex;flex-direction:column;background:var(--pw-card);border:1px solid var(--pw-line);border-radius:var(--pw-radius);padding:32px}
.pw__card.is-featured{background:var(--pw-accent);color:var(--pw-accent-text);border-color:var(--pw-accent)}
.pw[data-lift=true] .pw__card.is-featured{transform:translateY(-12px)}
.pw__badge{align-self:flex-start;font-size:12px;letter-spacing:.08em;padding:4px 10px;border-radius:999px;border:1px solid currentColor;margin-bottom:16px}
.pw__name{font-size:26px;margin:0 0 8px;font-weight:700}
.pw__desc{margin:0 0 24px;font-size:15px;line-height:1.6;opacity:.7;min-height:48px}
.pw__price{display:flex;align-items:baseline;gap:6px;margin-bottom:24px}
.pw__price b{font-size:34px}.pw__price span{opacity:.6;font-size:14px}
.pw__feat{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:10px;flex:1;font-size:15px}
.pw__feat li{display:flex;gap:8px;align-items:flex-start}
.pw__feat li:before{content:"✓";flex:none}
.pw__btn{display:block;text-align:center;text-decoration:none;font-weight:600;padding:14px;border-radius:calc(var(--pw-radius)/2);border:1px solid currentColor;color:inherit}
.pw__card.is-featured .pw__btn{background:var(--pw-accent-text);color:var(--pw-accent);border-color:var(--pw-accent-text)}
.pw[data-badge=false] .pw__badge{display:none}
.pw[data-feat=false] .pw__feat{display:none}
.pw__card.is-featured .pw__feat li:before{content:"✓"}
@media(max-width:900px){.pw__grid{grid-template-columns:1fr}.pw[data-lift=true] .pw__card.is-featured{transform:none}}
</style>
<section class="pw" id="cw-pw" data-align="left" data-lift="true" data-badge="true" data-feat="true">
 <div class="pw__in">
  <div class="pw__head"><p class="pw__eyebrow" data-g="eyebrow"></p><h2 class="pw__title" data-g="title"></h2><p class="pw__note" data-g="note"></p></div>
  <div class="pw__grid" id="cw-pw-grid"></div>
 </div>
</section>
<script>
/* 위젯 런타임 (조작 패널 없음). 설정값은 widget.html 상단 CW_CONFIG 숫자/값만 고치면 반영된다. */
(function(){
  var R=window.CWWidgets=window.CWWidgets||{};
  function setEditable(container,on){container.querySelectorAll('[data-f],[data-g]').forEach(function(n){n.contentEditable=on?'true':'false'})}
  function bindEdit(container,data,meta){container.addEventListener('input',function(e){var n=e.target.closest('[data-f],[data-g]');if(!n)return;if(n.dataset.g)meta[n.dataset.g]=n.textContent;else data[+n.dataset.i][n.dataset.f]=n.innerText.replace(/\n+$/,'')});container.addEventListener('keydown',function(e){if(e.target.isContentEditable&&e.key===' ')e.stopPropagation()})}
  window.CWPanel={toast:function(){},setEditable:setEditable,bindEdit:bindEdit,
  mount:function(cfg){
    var root=cfg.root,state={},map={},C=((window.CW_CONFIG||{})[root.id]||{}).settings||{};
    function coerce(c,v){if(c.type==='toggle')return v===true||v===1||v==='1'||v==='true';if(c.type==='range')return Number(v);return v}
    function ap(c){var v=state[c.key];if(c.css)root.style.setProperty(c.css,(c.type==='range'&&c.unit)?v+c.unit:v);if(c.attr)root.setAttribute(c.attr,c.type==='toggle'?String(!!v):v)}
    cfg.controls.forEach(function(c){if(!c.key)return;map[c.key]=c;state[c.key]=coerce(c,C[c.key]!==undefined?C[c.key]:c.default);ap(c)});
    var sc=cfg.controls.filter(function(c){return c.key&&c.key!=='edit'}).map(function(c){var o={};['key','type','label','css','attr','unit','min','max','step','options','default'].forEach(function(k){if(c[k]!==undefined)o[k]=c[k]});return o});
    document.documentElement.setAttribute('data-cw-schema-'+root.id,JSON.stringify({title:cfg.title,controls:sc}));
    cfg.onChange&&cfg.onChange(state,null);
    var api=R[root.id]={state:state,controls:cfg.controls,defaults:sc.reduce(function(o,c){o[c.key]=c.default;return o},{}),reset:function(){cfg.onReset&&cfg.onReset();Object.keys(map).forEach(function(k){state[k]=coerce(map[k],map[k].default);ap(map[k])});cfg.onChange&&cfg.onChange(state,null)},set:function(k,v){var c=map[k];if(!c)return;state[k]=coerce(c,v);ap(c);cfg.onChange&&cfg.onChange(state,k)},export:function(){return cfg.getExport?cfg.getExport(state):state}};
    return api}};
})();

(function(){
 var root=document.getElementById('cw-pw'),grid=document.getElementById('cw-pw-grid');
 var initMeta={eyebrow:'PLANS',title:'나에게 맞는 플랜을 고르세요',note:'모든 플랜은 언제든 변경하거나 해지할 수 있습니다.'};
 var meta=Object.assign({},initMeta);
 var init=[
  {badge:'LIGHT',name:'라이트',desc:'가볍게 시작하고 싶은 분을 위한 격월 플랜.',price:'29,000원',unit:'/ 격월',features:'오브제 2~3종 큐레이션\n무료 배송\n언제든 해지 가능',cta:'라이트 시작하기',featured:false},
  {badge:'STANDARD',name:'스탠다드',desc:'가장 많이 선택하는 균형 잡힌 월간 플랜.',price:'49,000원',unit:'/ 월',features:'오브제 3~5종 큐레이션\n무료 배송 · 반품\n1:1 스타일 상담 월 1회\n언제든 해지 가능',cta:'스탠다드 시작하기',featured:true},
  {badge:'PREMIUM',name:'프리미엄',desc:'아웃도어까지 폭넓게 경험하고 싶은 분께.',price:'79,000원',unit:'/ 월',features:'오브제 5종 이상 큐레이션\n무료 배송 · 반품\n전담 스타일리스트\n언제든 해지 가능',cta:'프리미엄 시작하기',featured:false}];
 var data=JSON.parse(JSON.stringify(init)),editing=false;
 function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
 function render(){
  root.querySelectorAll('[data-g]').forEach(function(n){n.textContent=meta[n.dataset.g]});
  grid.innerHTML=data.map(function(d,i){return '<article class="pw__card'+(d.featured?' is-featured':'')+'"><span class="pw__badge" data-i="'+i+'" data-f="badge">'+esc(d.badge)+'</span><h3 class="pw__name" data-i="'+i+'" data-f="name">'+esc(d.name)+'</h3><p class="pw__desc" data-i="'+i+'" data-f="desc">'+esc(d.desc)+'</p><div class="pw__price"><b data-i="'+i+'" data-f="price">'+esc(d.price)+'</b><span data-i="'+i+'" data-f="unit">'+esc(d.unit)+'</span></div><ul class="pw__feat">'+(editing?'<li style="display:block;white-space:pre-line" data-i="'+i+'" data-f="features">'+esc(d.features)+'</li>':d.features.split('\n').filter(Boolean).map(function(f){return '<li>'+esc(f)+'</li>'}).join(''))+'</ul><a class="pw__btn" href="#" data-i="'+i+'" data-f="cta">'+esc(d.cta)+'</a></article>'}).join('');
  grid.querySelectorAll('.pw__btn').forEach(function(a){a.onclick=function(e){e.preventDefault()}});
  CWPanel.setEditable(root,editing);
 }
 var CFG=(window.CW_CONFIG||{})['cw-pw']||{};if(CFG.meta)Object.assign(meta,CFG.meta);if(CFG.plans){data.length=0;CFG.plans.forEach(function(d){data.push(d)})}
 CWPanel.bindEdit(root,data,meta);
 CWPanel.mount({title:'요금제 위젯 설정',root:root,defaults:{edit:false},
  getExport:function(s){return{settings:s,meta:meta,plans:data}},
  onReset:function(){data.length=0;JSON.parse(JSON.stringify(init)).forEach(function(d){data.push(d)});Object.assign(meta,initMeta);editing=false;render()},
  onChange:function(s,k){if(k==='edit'||k===null)editing=!!s.edit;render()},
  controls:[
   {type:'group',label:'콘텐츠'},
   {key:'edit',type:'toggle',label:'텍스트 직접 편집',default:false},
   {type:'button',label:'+ 플랜 추가',onClick:function(){data.push({badge:'NEW',name:'새 플랜',desc:'설명을 입력하세요.',price:'0원',unit:'/ 월',features:'혜택 1\n혜택 2',cta:'시작하기',featured:false});render()}},
   {type:'button',label:'− 마지막 플랜 삭제',onClick:function(){data.pop();render()}},
   {type:'button',label:'★ 강조 플랜 순환',onClick:function(){var i=data.findIndex(function(d){return d.featured});data.forEach(function(d){d.featured=false});data[(i+1)%data.length].featured=true;render()}},
   {type:'group',label:'표시'},
   {key:'badge',type:'toggle',label:'뱃지 표시',attr:'data-badge',default:true},
   {key:'feat',type:'toggle',label:'혜택 목록 표시',attr:'data-feat',default:true},
   {key:'lift',type:'toggle',label:'강조 카드 띄우기',attr:'data-lift',default:true},
   {key:'align',type:'select',label:'제목 정렬',attr:'data-align',options:[{value:'left',label:'왼쪽'},{value:'center',label:'가운데'}],default:'left'},
   {type:'group',label:'스타일'},
   {key:'cols',type:'range',label:'열 수',css:'--pw-cols',min:1,max:4,default:3},
   {key:'bg',type:'color',label:'섹션 배경',css:'--pw-bg',default:'#f6f3ee'},
   {key:'card',type:'color',label:'카드 배경',css:'--pw-card',default:'#ffffff'},
   {key:'text',type:'color',label:'글자색',css:'--pw-text',default:'#1b1b1b'},
   {key:'accent',type:'color',label:'강조색',css:'--pw-accent',default:'#1b1b1b'},
   {key:'atext',type:'color',label:'강조 글자색',css:'--pw-accent-text',default:'#ffffff'},
   {key:'line',type:'color',label:'테두리색',css:'--pw-line',default:'#e2ddd4'},
   {key:'radius',type:'range',label:'모서리',css:'--pw-radius',unit:'px',min:0,max:40,default:20},
   {key:'gap',type:'range',label:'카드 간격',css:'--pw-gap',unit:'px',min:8,max:56,default:24},
   {key:'pad',type:'range',label:'상하 여백',css:'--pw-pad',unit:'px',min:16,max:200,step:4,default:96}
  ]});
})();
</script>
<script>/* 커스텀 사이드바 (미리보기 전용): CWWidgets[id]에 붙어 숫자/색상/선택/토글 입력으로 실시간 조작 */
(function(){
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e}
  function mount(id){
    var w=window.CWWidgets&&CWWidgets[id];if(!w)return;
    var sb=el('aside','cw-sb'),body=el('div','cw-sb__body');
    sb.appendChild(el('div','cw-sb__head','커스텀<small>숫자·색상을 입력하면 바로 반영됩니다</small>'));sb.appendChild(body);
    var sync=[];
    w.controls.forEach(function(c){
      if(c.type==='group'){body.appendChild(el('div','cw-sb__g',c.label));return}
      if(c.type==='button'){var b=el('div','cw-sb__b');var bt=el('button','',c.label);bt.type='button';bt.onclick=c.onClick;b.appendChild(bt);body.appendChild(b);return}
      var row=el('div','cw-sb__r'),lab=el('label','',c.label);row.appendChild(lab);var inp,hex;
      if(c.type==='select'){inp=el('select');c.options.forEach(function(o){var op=el('option','',o.label||o);op.value=o.value!==undefined?o.value:o;inp.appendChild(op)})}
      else if(c.type==='toggle'){inp=el('input');inp.type='checkbox'}
      else if(c.type==='color'){inp=el('input');inp.type='color';hex=el('input');hex.type='text';hex.maxLength=7}
      else{inp=el('input');inp.type='number';inp.min=c.min;inp.max=c.max;inp.step=c.step||1;inp.inputMode='decimal'}
      function show(){var v=w.state[c.key];if(c.type==='toggle')inp.checked=!!v;else inp.value=v;if(hex)hex.value=v}
      function put(v){
        if(c.type==='range'){if(v===''||isNaN(Number(v)))return;v=Math.min(c.max,Math.max(c.min,Number(v)))}
        w.set(c.key,v)}
      inp.addEventListener(c.type==='select'||c.type==='toggle'?'change':'input',function(){put(c.type==='toggle'?inp.checked:inp.value);if(hex)hex.value=inp.value});
      if(c.type==='range')inp.addEventListener('blur',show);
      if(hex)hex.addEventListener('change',function(){if(/^#[0-9a-f]{6}$/i.test(hex.value)){put(hex.value);inp.value=hex.value}else show()});
      row.appendChild(inp);if(hex)row.appendChild(hex);if(c.type==='range'&&c.unit)row.appendChild(el('span','u',c.unit));
      body.appendChild(row);sync.push(show);show();
    });
    var bar=el('div','cw-sb__b');bar.innerHTML='<button type="button" data-a="r">초기화</button><button type="button" class="p" data-a="c">설정값 복사</button>';
    bar.onclick=function(e){var a=e.target.dataset.a;if(a==='r'){w.reset();sync.forEach(function(f){f()})}
      if(a==='c'){var ex=w.export(),st={};Object.keys(w.state).forEach(function(k){if(k==='edit')return;var v=w.state[k];st[k]=v===true?1:v===false?0:v});
