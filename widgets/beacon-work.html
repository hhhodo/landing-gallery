    POP.innerHTML='<h4>이미지</h4><input type="file" accept="image/*" hidden><button type="button" class="p w" data-a="file">파일 선택</button><div class="row"><input type="text" placeholder="이미지 주소 https://…"><button type="button" data-a="url">적용</button></div>'+(cur?'<div class="row"><button type="button" class="w d" data-a="clear">이미지 비우기</button></div>':'')+'<div class="msg"></div><small>1600px 이하로 줄여 위젯에 포함돼요. 새로고침하면 사라지니 「설정값 복사」로 보관하세요.</small>';
    document.body.appendChild(POP);
    var rc=anchor.getBoundingClientRect(),x=Math.min(Math.max(8,rc.left+16),window.innerWidth-316),y=Math.min(Math.max(8,rc.top+16),Math.max(8,window.innerHeight-POP.offsetHeight-8));
    POP.style.left=x+'px';POP.style.top=y+'px';
    var fi=POP.querySelector('input[type=file]'),msg=POP.querySelector('.msg');
    fi.addEventListener('change',function(){toData(fi.files[0],function(u){set(u);closePop()},function(m){msg.textContent=m})});
    POP.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var a=b.dataset.a;
      if(a==='file')fi.click();
      if(a==='url'){var v=POP.querySelector('input[type=text]').value.trim();if(v){set(v);closePop()}}
      if(a==='clear'){set('');closePop()}})}
  document.addEventListener('mousedown',function(e){if(POP&&!POP.contains(e.target)&&!e.target.closest('[data-img-i]'))closePop()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closePop()});
  window.CWPanel.pickImage=pickImage;window.CWPanel.imageFromFile=toData;
})();

(function(){
 var root=document.getElementById('cw-bc'),editing=false;
 var initMeta={"title": "놓치면 아쉬운 성과"},meta=Object.assign({},initMeta);
 var init=[{"img": "", "title": "1인 스킨케어 브랜드", "stats": "전환율 개선 | +156%\n광고비 절감 | -41%\n운영 기간 | 4개월"}, {"img": "", "title": "1인 편집숍 브랜드", "stats": "신규 고객 유입 | +72%\n재구매율 | +38%\n운영 기간 | 3개월"}, {"img": "", "title": "1인 디지털 굿즈 브랜드", "stats": "매출 성장 | +85%\n고객 획득 비용 | -28%\n운영 기간 | 5개월"}];
 var data=JSON.parse(JSON.stringify(init));
 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 function T(s){return esc(s).replace(/\n/g,'<br>')}
 function metaFill(){root.querySelectorAll('[data-g]').forEach(function(n){var v=meta[n.dataset.g];if(v===undefined){n.style.display='none';return}n.innerHTML=T(v)})}

 var row=document.getElementById('cw-bc-row');
 function render(){metaFill();root.setAttribute('data-editing',editing);
  row.innerHTML=data.map(function(d,i){var st=editing?'<div class="work-card__stats"><div style="white-space:pre-line" data-i="'+i+'" data-f="stats">'+esc(d.stats)+'</div></div>':'<div class="work-card__stats">'+String(d.stats||'').split('\n').filter(Boolean).map(function(l){var p=l.split('|');return '<div class="work-card__stat"><span class="subtle">'+esc((p[0]||'').trim())+'</span><span>'+esc((p.slice(1).join('|')||'').trim())+'</span></div>'}).join('')+'</div>';
   return '<article class="work-card"><div class="work-card__media" data-img-i="'+i+'">'+(d.img?'<img class="work-card__photo" src="'+esc(d.img)+'" alt="">':'<div class="work-card__photo cw-ph"></div>')+'</div><div class="work-card__body"><h3 class="work-card__title" data-i="'+i+'" data-f="title">'+esc(d.title)+'</h3>'+st+'</div></article>'}).join('');
  CWPanel.setEditable(root,editing)}
 function step(){var c=row.querySelector('.work-card');var gap=parseFloat(getComputedStyle(row).columnGap||0);return (c?c.offsetWidth:row.clientWidth)+gap}
 document.getElementById('cw-bc-prev').addEventListener('click',function(){row.scrollBy({left:-step(),behavior:'smooth'})});
 document.getElementById('cw-bc-next').addEventListener('click',function(){row.scrollBy({left:step(),behavior:'smooth'})});

 var CFG=(window.CW_CONFIG||{})['cw-bc']||{};if(CFG.meta)Object.assign(meta,CFG.meta);if(CFG.items){data.length=0;CFG.items.forEach(function(d){data.push(d)})}
 root.addEventListener('click',function(e){var t=e.target.closest('[data-img-i]');if(!editing||!t)return;e.preventDefault();e.stopPropagation();var i=+t.getAttribute('data-img-i');CWPanel.pickImage(t,data[i].img||'',function(u){data[i].img=u;render()})},true);
 root.addEventListener('dragover',function(e){if(editing&&e.target.closest('[data-img-i]'))e.preventDefault()});
 root.addEventListener('drop',function(e){var t=e.target.closest('[data-img-i]');if(!editing||!t)return;e.preventDefault();var i=+t.getAttribute('data-img-i'),f=e.dataTransfer&&e.dataTransfer.files[0];if(f)CWPanel.imageFromFile(f,function(u){data[i].img=u;render()},function(m){alert(m)})});
 CWPanel.bindEdit(root,data,meta);
 CWPanel.mount({title:'사례 캐러셀 위젯',root:root,defaults:{edit:false},
  getExport:function(s){return{settings:s,meta:meta,items:data}},
  onReset:function(){data.length=0;JSON.parse(JSON.stringify(init)).forEach(function(d){data.push(d)});Object.assign(meta,initMeta);editing=false;render()},
  onChange:function(s,k){editing=!!s.edit;render()},
  controls:[
   {type:'group',label:'콘텐츠'},
   {key:'edit',type:'toggle',label:'글자·이미지 편집',default:false},
   {type:'button',label:"+ 사례 추가",onClick:function(){data.push({img:data[0]?data[0].img:'',title:'새 사례',stats:'지표 | 값\n지표 | 값'});render()}},
   {type:'button',label:"− 마지막 사례 삭제",onClick:function(){if(data.length>1)data.pop();render()}},
   {type:'group',label:"색상·여백"},
   {key:'bg',type:'color',label:"배경색",css:'--color-canvas',default:'#ffffff'},
   {key:'card',type:'color',label:"카드 배경",css:'--bc-card',default:'#ffffff'},
   {key:'ink',type:'color',label:"글자색",css:'--text-default',default:'#262628'},
   {key:'sub',type:'color',label:"보조 글자색",css:'--text-subtle',default:'#5d5e5f'},
   {key:'pad',type:'range',label:"위 여백",css:'--space-12',unit:'px',min:0,max:400,step:4,default:200},
   {type:'group',label:"카드"},
   {key:'w',type:'range',label:"카드 너비",css:'--bc-w',unit:'px',min:600,max:1600,step:10,default:1280},
   {key:'h',type:'range',label:"카드 높이",css:'--bc-h',unit:'px',min:300,max:800,step:10,default:560},
   {key:'media',type:'range',label:"이미지 영역 비율",css:'--bc-media',unit:'%',min:20,max:80,step:1,default:50},
   {key:'radius',type:'range',label:"카드 모서리",css:'--bc-radius',unit:'px',min:0,max:80,step:1,default:32},
   {key:'gap',type:'range',label:"카드 간격",css:'--bc-gap',unit:'px',min:0,max:80,step:1,default:24},
   {type:'group',label:"표시"},
   {key:'tt',type:'toggle',label:"제목 표시",attr:'data-title',default:true},
   {key:'stats',type:'toggle',label:"성과 수치 표시",attr:'data-stats',default:true},
   {key:'arrows',type:'toggle',label:"좌우 버튼 표시",attr:'data-arrows',default:true}
  ]});
})();
</script>
<script>/* 커스텀 사이드바 (미리보기 전용) */
(function(){
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e}
  function mount(id){
    var w=window.CWWidgets&&CWWidgets[id];if(!w)return;
    var sb=el('aside','cw-sb'),body=el('div','cw-sb__body'),rows=[];
    sb.appendChild(el('div','cw-sb__head','커스텀'));sb.appendChild(body);
    function visible(c){if(!c.when)return true;var v=String(w.state[c.when.key]);return c.when.is.map(String).indexOf(v)>-1}
    function refresh(){
      var g=null,any=false;
      rows.forEach(function(r){
        if(r.isGroup){if(g)g.el.classList.toggle('hide',!any);g=r;any=false;return}
        var ok=visible(r.c);r.el.classList.toggle('hide',!ok);if(ok)any=true});
      if(g)g.el.classList.toggle('hide',!any)}
    var syncs=[];
    w.controls.forEach(function(c){
      if(c.type==='group'){var ge=el('div','cw-sb__g',c.label);body.appendChild(ge);rows.push({isGroup:true,el:ge});return}
      if(c.type==='button'){var b=el('div','cw-sb__b');var bt=el('button','',c.label);bt.type='button';bt.onclick=c.onClick;b.appendChild(bt);body.appendChild(b);return}
      var seg=c.type==='select'&&c.options.length<=6;
      var row=el('div','cw-sb__r'+(seg?' col':''));row.appendChild(el('label','',c.label));
      var ctl;
      if(seg){
        ctl=el('div','cw-sb__seg');
        var btns=c.options.map(function(o){var v=o.value!==undefined?o.value:o,bt=el('button','',o.label||o);bt.type='button';bt.dataset.v=v;bt.onclick=function(){w.set(c.key,v);show();refresh()};ctl.appendChild(bt);return bt});
        var show=function(){btns.forEach(function(b){b.classList.toggle('on',b.dataset.v===String(w.state[c.key]))})};
      }else if(c.type==='select'){
        ctl=el('select');c.options.forEach(function(o){var op=el('option','',o.label||o);op.value=o.value!==undefined?o.value:o;ctl.appendChild(op)});
        ctl.onchange=function(){w.set(c.key,ctl.value);refresh()};var show=function(){ctl.value=w.state[c.key]};
      }else if(c.type==='toggle'){
        ctl=el('label','cw-sb__sw','<input type="checkbox"><span></span>');var cb=ctl.querySelector('input');
        cb.onchange=function(){w.set(c.key,cb.checked);refresh()};var show=function(){cb.checked=!!w.state[c.key]};
      }else if(c.type==='color'){
        ctl=el('div','cw-sb__c','<input type="color"><input type="text" maxlength="7">');var ci=ctl.children[0],ht=ctl.children[1];
        ci.oninput=function(){ht.value=ci.value;w.set(c.key,ci.value)};
        ht.onchange=function(){if(/^#[0-9a-f]{6}$/i.test(ht.value)){ci.value=ht.value;w.set(c.key,ht.value)}else show()};
        var show=function(){ci.value=w.state[c.key];ht.value=w.state[c.key]};
      }else{
        ctl=el('div','cw-sb__n','<input type="number" min="'+c.min+'" max="'+c.max+'" step="'+(c.step||1)+'" inputmode="decimal">'+(c.unit?'<i>'+c.unit+'</i>':''));var ni=ctl.querySelector('input');
        ni.oninput=function(){if(ni.value===''||isNaN(Number(ni.value)))return;w.set(c.key,Math.min(c.max,Math.max(c.min,Number(ni.value))))};
        ni.onblur=function(){show()};var show=function(){ni.value=w.state[c.key]};
      }
      row.appendChild(ctl);body.appendChild(row);rows.push({c:c,el:row});syncs.push(show);show();
    });
    var foot=el('div','cw-sb__foot','<button type="button" data-a="r">초기화</button><button type="button" class="p" data-a="c">설정값 복사</button>');
    foot.onclick=function(e){var a=e.target.dataset.a;if(a==='r'){w.reset();syncs.forEach(function(f){f()});refresh()}
      if(a==='c'){var ex=w.export(),st={};Object.keys(w.state).forEach(function(k){if(k==='edit')return;var v=w.state[k];st[k]=v===true?1:v===false?0:v});
        var lk=Object.keys(ex).filter(function(k){return k!=='settings'&&k!=='meta'})[0],o={settings:st,meta:ex.meta};o[lk]=ex[lk];
        var txt="window.CW_CONFIG['"+id+"'] = "+JSON.stringify(o,null,2)+';';
        (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('복사됨 · widget.html 상단 CW_CONFIG에 붙여넣기')},function(){window.prompt('복사하세요',txt)})}};
    sb.appendChild(foot);document.body.appendChild(sb);refresh();
    if(!/[?&]nosidebar/.test(location.search))document.body.classList.add('cw-has-sidebar');else sb.style.display='none';
  }
  function toast(m){var t=el('div','cw-sb__t',m);document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}
  window.CWSidebar={mount:mount};
})();

CWSidebar.mount('cw-bc');</script></body></html>
